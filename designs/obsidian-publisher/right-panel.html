<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九漾 Onda · Obsidian 发布原型</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232383E2'/%3E%3C/svg%3E">
<script>
  // data-theme 保存偏好；system 交给 CSS 媒体查询解析，避免初始化时把系统偏好固化成 light/dark。
  (function(){
    var key = "obsidian-publisher-theme";
    var saved = localStorage.getItem(key);
    var pref = saved === "light" || saved === "dark" ? saved : "system";
    document.documentElement.dataset.theme = pref;
    document.documentElement.style.colorScheme = pref === "system" ? "light dark" : pref;
  })();
</script>
<style>
  /* 视觉延续 onda-explore/mosaic：白底、发丝线、中性灰阶、功能色只做小面积信号。 */
  :root{
  color-scheme:light;
    --blue:#2C6FF0;
    --magenta:#D52088;
    --orange:#FD8D11;
    --cyan:#0EC3D4;
    --green:#07B56F;
    --error:#C81E4E;
    --error-soft:#FDF1F4;
    --error-line:#F2C2D1;
    --warn:#9A6700;
    --warn-soft:#FFF8E6;
    --warn-line:#EBDFAF;
    --ok-soft:#EBF8F1;
    --ok-line:#BEE5D2;
    --ink:#37352F;
    --ink2:#787672;
    --ink3:#ABA9A4;
    --paper:#FFFFFF;
    --card:#FFFFFF;
    --rail:#FBFBFA;
    --line:#EDECE9;
    --hover:#F4F3F1;
    --selected:#F1F0EE;
    --accent:#2383E2;
    --accent-tint:#E9F3FB;
    --plat-x:#16130E;
    --plat-x-fg:#FFFFFF;
    --shadow-card:0 1px 2px rgba(15,15,15,.04);
    --shadow-pop:0 14px 40px rgba(15,15,15,.14);
    --r-lg:20px;
    --r-md:14px;
    --r-sm:10px;
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  [data-theme="dark"]{
  color-scheme:dark;
    --error:#E5484D;
    --error-soft:rgba(229,72,77,.12);
    --error-line:rgba(229,72,77,.38);
    --warn:#D9A53F;
    --warn-soft:rgba(217,165,63,.12);
    --warn-line:rgba(217,165,63,.34);
    --ok-soft:rgba(7,181,111,.13);
    --ok-line:rgba(7,181,111,.32);
    --ink:#E6E5E3;
    --ink2:#9B9A97;
    --ink3:#6F6E69;
    --paper:#191919;
    --card:#252525;
    --rail:#202020;
    --line:#2F2F2F;
    --hover:#2A2A2A;
    --selected:#2F2F2F;
    --accent:#4A9EE8;
    --accent-tint:#20304A;
    --plat-x:#E6E5E3;
    --plat-x-fg:#191919;
    --shadow-card:0 1px 2px rgba(0,0,0,.3);
    --shadow-pop:0 14px 40px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme: dark){
    :root[data-theme="system"]{
      color-scheme:dark;
      --error:#E5484D;
      --error-soft:rgba(229,72,77,.12);
      --error-line:rgba(229,72,77,.38);
      --warn:#D9A53F;
      --warn-soft:rgba(217,165,63,.12);
      --warn-line:rgba(217,165,63,.34);
      --ok-soft:rgba(7,181,111,.13);
      --ok-line:rgba(7,181,111,.32);
      --ink:#E6E5E3;
      --ink2:#9B9A97;
      --ink3:#6F6E69;
      --paper:#191919;
      --card:#252525;
      --rail:#202020;
      --line:#2F2F2F;
      --hover:#2A2A2A;
      --selected:#2F2F2F;
      --accent:#4A9EE8;
      --accent-tint:#20304A;
      --plat-x:#E6E5E3;
      --plat-x-fg:#191919;
      --shadow-card:0 1px 2px rgba(0,0,0,.3);
      --shadow-pop:0 14px 40px rgba(0,0,0,.5);
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body,#root{height:100%}
  body{font-family:var(--font);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input{font-family:inherit}
  ::-webkit-scrollbar{width:0;height:0}

  .proto{height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .proto-top{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:9px 14px;background:var(--rail);
    font-size:12.5px;color:var(--ink2);
  }
  .proto-top strong{font-size:13px;color:var(--ink);letter-spacing:-.1px}
  .proto-top .actions{margin-left:auto;display:flex;gap:6px}
  .ghost-btn{
    display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;
    border:1px solid var(--line);border-radius:999px;background:var(--card);
    font-size:12px;color:var(--ink);transition:.15s ease;
  }
  .ghost-btn:hover{background:var(--hover)}
  .ghost-btn.active{border-color:color-mix(in srgb,var(--accent) 42%,transparent);background:var(--accent-tint);color:var(--accent)}

  .stage{flex:1;min-height:0;display:flex;justify-content:center;overflow:auto}
  @media (max-width:900px){.icon-rail{display:none}.obsidian{grid-template-columns:minmax(130px,170px) minmax(160px,1fr) minmax(300px,356px)}}
  @media (max-width:660px){.obsidian{grid-template-columns:minmax(280px,1fr) minmax(300px,356px)}.vault{display:none}}
  .obsidian{
    width:min(1440px,100%);height:100%;display:grid;
    grid-template-columns:48px minmax(140px,190px) minmax(170px,1fr) minmax(300px,366px);
    overflow:hidden;
  }
  @media (max-width:900px){.icon-rail{display:none}.obsidian{grid-template-columns:minmax(130px,170px) minmax(160px,1fr) minmax(300px,356px)}}
  @media (max-width:660px){.obsidian{grid-template-columns:minmax(280px,1fr) minmax(300px,356px)}.vault{display:none}}

  .icon-rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0}
  .rail-dot{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:15px}
  .rail-dot:hover{background:var(--hover);color:var(--ink)}
  .rail-dot.active{background:var(--selected);color:var(--ink)}

  .vault{background:var(--rail);padding:12px 10px;overflow:auto}
  .vault h2{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:0 6px 8px}
  .vault-group{font-size:11.5px;font-weight:700;color:var(--ink2);padding:8px 6px 5px}
  .file{display:flex;align-items:center;gap:7px;min-height:28px;padding:0 6px;border-radius:7px;color:var(--ink2);font-size:12.8px}
  .file:hover{background:var(--hover);color:var(--ink)}
  .file.active{background:var(--selected);color:var(--ink);font-weight:600}
  .file .glyph{width:14px;color:var(--ink3);font-family:var(--mono);font-size:10px;text-align:center}

  .editor{min-width:0;display:flex;flex-direction:column;background:var(--paper)}
  .editor-bar{
    flex:0 0 auto;height:40px;display:flex;align-items:center;gap:8px;
    padding:0 14px;color:var(--ink3);font-size:11.5px;
  }
  .editor-scroll{flex:1;overflow:auto;padding:24px 36px 60px}
  .note-title{font-size:27px;font-weight:700;letter-spacing:-.5px;line-height:1.3}
  .note-meta{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 20px}
  .tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);font-size:11px;background:var(--card)}
  .tag b{font-weight:600;color:var(--ink)}
  .note-body{max-width:680px;color:var(--ink);font-size:14px;line-height:1.9}
  .note-body p{margin:0 0 12px}
  .note-body h3{margin:18px 0 8px;font-size:17px;letter-spacing:-.2px}
  .note-body blockquote{margin:0 0 12px;padding:3px 0 3px 11px;border-left:2px solid var(--line);color:var(--ink2)}
  .note-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px;max-width:560px}
  .photo{aspect-ratio:4/3;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
  .note-media-strip{display:flex;gap:9px;max-width:680px;margin:16px 0 4px;padding-bottom:3px;overflow-x:auto;scrollbar-width:none}
  .note-media-strip::-webkit-scrollbar{display:none}
  .note-media{flex:0 0 168px;margin:0}
  .note-media>div{aspect-ratio:4/3;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
  .note-media figcaption{margin-top:5px;color:var(--ink3);font-size:9.5px}
  .note-video{max-width:680px;margin:16px 0 4px}
  .note-video>div{position:relative;aspect-ratio:16/9;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
  .note-video .play{position:absolute;left:14px;bottom:12px}
  .note-video b{font-size:15px}
  .note-video small{position:absolute;right:13px;bottom:13px;font-family:var(--mono);font-size:10px}
  .note-audio{display:flex;align-items:center;gap:10px;max-width:680px;margin:16px 0 4px;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  .note-audio .play{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:9px}
  .note-audio .wave{display:flex;align-items:center;gap:2px;flex:1;height:20px}
  .note-audio .wave i{width:2px;height:7px;border-radius:2px;background:var(--ink3)}
  .note-audio .wave i:nth-child(3n){height:14px}
  .note-audio .wave i:nth-child(4n){height:18px}
  .note-audio .name{font-size:11px;font-weight:700}
  .note-audio .time{font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
  .note-article-media{max-width:680px;margin:16px 0 4px}
  .note-article-media figure{margin:0}
  .note-article-media>figure>div{aspect-ratio:16/8;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
  .note-article-media figcaption{margin-top:5px;color:var(--ink3);font-size:9.5px}
  .payload-audio{min-width:100%;display:flex;align-items:center;gap:9px;padding:12px;border-radius:9px;background:var(--rail);border:1px solid var(--line);font-size:10.5px}
  .payload-audio .play{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:8px}
  .payload-audio .name{flex:1;min-width:0;font-weight:700}
  .payload-audio .time{font-family:var(--mono);color:var(--ink3);font-size:9px}
  .gallery .item.media-wide{flex-basis:100%}

  /* ---------- 右侧面板 ---------- */
  .panel{min-width:0;display:flex;flex-direction:column;gap:0;overflow:hidden;background:var(--rail)}
  .panel-head{flex:0 0 auto;padding:13px 14px 10px;background:var(--card)}
  .head-top{display:flex;align-items:center;gap:8px}
  .mark{
    width:26px;height:26px;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;gap:2px;
    padding:4px;background:var(--ink);flex:0 0 auto;
  }
  .mark i{border-radius:2px;background:var(--paper)}
  .mark i:nth-child(1){background:#2C6FF0}
  .mark i:nth-child(2){background:#D52088}
  .mark i:nth-child(4){background:#0EC3D4}
  .panel-head h1{flex:1;font-size:15px;font-weight:700;letter-spacing:-.2px;line-height:1.2}
  .theme-btn{width:27px;height:27px;border-radius:8px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
  .theme-btn:hover{background:var(--hover);color:var(--ink)}
  .conn-indicator{
    width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
    color:var(--ink2);transition:background .15s;
  }
  .conn-indicator:hover{background:var(--hover)}
  .conn-indicator .dot{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
  .conn-indicator.on .dot{background:var(--green);box-shadow:0 0 0 3px rgba(7,181,111,.12)}
  .conn-indicator.wait .dot{background:var(--orange);animation:pulse 1.2s ease infinite}
  .conn-indicator.bad .dot{background:var(--error);box-shadow:0 0 0 3px var(--error-soft)}
  @keyframes pulse{50%{opacity:.28}}

  .mode{
    margin:10px 14px 0;display:grid;grid-template-columns:1fr 1fr;gap:3px;
    padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--rail);
  }
  .mode button{
    min-height:31px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2);
    transition:.16s ease;display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .mode button:hover{color:var(--ink)}
  .mode button.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow-card)}
  .mode-count{min-width:17px;height:16px;padding:0 4px;border-radius:99px;background:var(--selected);color:var(--ink2);font-family:var(--mono);font-size:9.5px;display:flex;align-items:center;justify-content:center}
  .mode button.active .mode-count{background:var(--accent-tint);color:var(--accent)}

  .panel-body{flex:1;min-height:0;overflow:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:11px}
  /* 预览页下部固定在视口内：检查与平台选择保持可见，长正文只在 payload 卡片里滚动。 */
  .panel-body:has(.preview-frame){overflow:hidden}
  .source-type{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-bottom:1px}
  .source-type button{min-height:38px;padding:4px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink2);font-size:11px;font-weight:700;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .source-type button .dot{width:10px;height:10px;border-radius:3px}
  .source-type button.active{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-tint);color:var(--ink)}
  .mode{grid-template-columns:repeat(2,minmax(0,1fr))}

  .panel-foot{flex:0 0 auto;padding:10px 14px 12px;background:var(--card)}
  .task-strip{display:flex;flex-wrap:wrap;gap:5px;padding:2px 0 4px}
  .task-chip{min-height:27px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:10px;font-weight:650}
  .task-chip:hover{background:var(--hover);color:var(--ink)}
  .task-chip .glyph{width:16px;height:16px;border-radius:5px;color:#fff;display:grid;place-items:center;font-size:8px;font-weight:800}
  .task-chip.running{color:var(--accent)}
  .task-chip.waiting{color:var(--warn)}
  .task-chip.success{color:var(--green)}
  .task-chip.failed{color:var(--error)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-card)}
  .kv{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink2)}
  .kv b{color:var(--ink);font-weight:600}

  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{
    display:inline-flex;align-items:center;gap:5px;min-height:27px;padding:0 8px;
    border-radius:8px;border:1px solid var(--line);background:var(--card);
    font-size:11.5px;color:var(--ink2);transition:.15s ease;
  }
  .chip:hover{background:var(--hover);color:var(--ink)}
  .chip.selected{border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-tint);color:var(--ink)}
  .chip .glyph{width:16px;height:16px;border-radius:5px;color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .chip.icon-only{width:34px;min-height:34px;justify-content:center;padding:0;border-radius:11px}
  .chip.icon-only .glyph{width:19px;height:19px;border-radius:6px;font-size:10px}
  .chip .state{width:5px;height:5px;border-radius:50%}

  .section-title{display:flex;align-items:center;gap:6px;margin:1px 2px 0;font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em}
  .section-title .hint{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--mono);font-size:10px}

  .preview{padding:11px;display:flex;flex-direction:column;gap:9px}
  .preview-head{display:flex;align-items:flex-start;gap:8px}
  .preview-head .title{font-size:13.5px;font-weight:700;line-height:1.35}
  .preview-head .sub{margin-top:3px;font-size:10.5px;color:var(--ink2);line-height:1.4}
  .preview-head .glyph{width:26px;height:26px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
  .selector-card{
    padding:7px;border:1px solid var(--line);border-radius:10px;background:var(--card);
    display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-card);
  }
  .selector-row{display:flex;align-items:center;gap:6px;min-width:0}
  .selector-label{width:24px;flex:0 0 auto;color:var(--ink3);font-size:9.5px;font-weight:800;text-align:center}
  .type-options{flex:1;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}
  .type-option{min-height:25px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--rail);color:var(--ink2);font-size:9.5px;font-weight:800;display:grid;place-items:center}
  .type-option.active{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-tint);color:var(--ink)}
  .platform-options{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
  .platform-options::-webkit-scrollbar{display:none}
  .platform-option{position:relative;flex:0 0 auto;width:27px;height:27px;border:1px solid transparent;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:900;opacity:.46}
  .platform-option:hover{opacity:.76}
  .platform-option.active,.platform-option.selected{opacity:1;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
  .platform-option.selected{border-color:transparent}
  .platform-option.muted{background:var(--hover)!important;color:var(--ink3)!important;box-shadow:none!important;border-color:transparent}
  .selector-summary{
    min-height:27px;padding:0 5px 0 7px;border-top:1px solid var(--line);
    display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:10.5px;
  }
  .selector-summary .count{display:inline-flex;align-items:baseline;gap:3px}
  .selector-summary .count strong{color:var(--ink);font-family:var(--mono);font-size:11px;font-weight:700}
  .selector-summary .count .total{color:var(--ink3);font-family:var(--mono);font-size:10px}
  .selector-summary .divider{width:1px;height:14px;background:var(--line)}
  .selector-summary .summary-link{
    margin-left:auto;min-height:21px;padding:0 7px;border-radius:999px;background:transparent;
    display:inline-flex;align-items:center;gap:4px;color:var(--ink2);font-size:10px;font-weight:650;
    transition:.15s ease;
  }
  .selector-summary .summary-link:hover{background:var(--hover);color:var(--ink)}
  .selector-summary .summary-link .arrow{font-family:var(--mono);font-size:10px;line-height:1;transform:translateY(.5px)}
  .findings-panel{border:1px solid var(--line);border-radius:9px;background:var(--card);overflow:hidden}
  .findings-panel summary{
    list-style:none;cursor:pointer;padding:6px 8px;color:var(--ink2);font-size:10px;font-weight:800;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .findings-panel summary::-webkit-details-marker{display:none}
  .findings-panel summary::after{content:"展开";color:var(--ink3);font-size:9px}
  .findings-panel[open] summary::after{content:"收起"}
  .findings-panel .findings{padding:0 7px 7px}
  .preview-frame{
    flex:1 1 auto;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:11px;
    background:var(--card);padding:10px;box-shadow:var(--shadow-card);overscroll-behavior:contain;
  }
  .preview-content{display:flex;flex-direction:column;gap:9px}
  .preview-content .gallery{gap:6px;margin:0 0 8px}
  .preview-content .gallery .item{flex:0 0 31%}
  .preview-content .gallery .media{height:52px;font-size:8px}
  .plain{font-size:12.5px;line-height:1.72;color:var(--ink);white-space:pre-wrap;text-wrap:pretty}
  .rich h4{font-size:15px;margin:0 0 7px;letter-spacing:-.2px}
  .rich p{font-size:12.3px;line-height:1.72;margin:0 0 8px;color:var(--ink)}

function PayloadAttachments({items = [], compact=false}){
  const trackRef = useRef(null);
  const dragRef = useRef(null);
  const [dragging, setDragging] = useState(false);

  const startDrag = (event) => {
    const track = trackRef.current;
    if (!track) return;
    dragRef.current = { x:event.clientX, left:track.scrollLeft };
    setDragging(true);
    try { track.setPointerCapture(event.pointerId); } catch {}
  };
  const moveDrag = (event) => {
    const track = trackRef.current;
    const drag = dragRef.current;
    if (!track || !drag) return;
    track.scrollLeft = drag.left - (event.clientX - drag.x);
  };
  const endDrag = () => {
    dragRef.current = null;
    setDragging(false);
  };

  if (!items.length) return null;

  return (
    <div
      ref={trackRef}
      className={`gallery${compact ? " compact" : ""}${dragging ? " dragging" : ""}`}
      aria-label="单行滑动的完整图片附件"
      onPointerDown={startDrag}
      onPointerMove={moveDrag}
      onPointerUp={endDrag}
      onPointerCancel={endDrag}
      onPointerLeave={endDrag}
    >
      {items.filter(item => item.kind === "image").map((p,i) => (
        <figure key={p.name} className="item">
          <div className="media" style={{background:p.color}}>{p.name}</div>
        </figure>
      ))}
      {items.filter(item => item.kind === "video").map(item => (
        <figure key={item.name} className="item media-wide">
          <div className="media" style={{background:item.color}}>
            <span>视频 · {item.duration}</span>
          </div>
        </figure>
      ))}
      {items.filter(item => item.kind === "audio").map(item => (
        <div key={item.name} className="payload-audio">
          <span className="play">▶</span>
          <span className="name">{item.name}</span>
          <span className="time">{item.duration}</span>
        </div>
      ))}
    </div>
  );
}

      ? "发布通道可用；扩展连接本机发布服务，桌面端和 Obsidian 共用"
      : extension === "waiting"
        ? "等待浏览器扩展自动连接"
        : "浏览器扩展未连接，点击连接";
  const dark = theme === "dark" || (theme === "system" && systemDark);

  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme === "system" ? "light dark" : theme;
  }, [theme]);

  useEffect(() => {
    const media = window.matchMedia("(prefers-color-scheme: dark)");
    const sync = (event) => setSystemDark(event.matches);
    media.addEventListener("change", sync);
    return () => media.removeEventListener("change", sync);
  }, []);

  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  const findings = useMemo(() => {
    const mediaText = note.type === "image"
      ? `${note.media.length} 张图片将按出现顺序组成图集。`
      : note.type === "video"
        ? "视频引用已解析为主媒体。"
        : note.type === "audio"
          ? "音频引用已解析为主媒体。"
          : note.media.length
            ? `${note.media.length} 张图片保留在正文原位。`
            : "正文没有媒体引用。";
    const common = [
      {level:"ok", text:`frontmatter 完整：${note.id} / ${note.type}`},
      {level:"ok", text:mediaText},
      {level:"warn", text:"仅支持 CommonMark + GFM；wiki link、callout 和专有语法不会发布。"},
    ];
    if(activePlatform === "jike") return [...common, {level:"ok", text:"即刻不支持独立文章；本篇自动降级为图文动态。"}];
    if(activePlatform === "xhs") return [...common, {level:"warn", text:"小红书正文是纯文本，不携带 Markdown 格式。"}];
    if(activePlatform === "weibo") return [...common, {level:"ok", text:"话题会转为 #话题#，图片作为附件上传。"}];
    if(activePlatform === "wechat") return [...common, {level:"ok", text:"图片将先进入公众号素材库，再替换正文引用。"}];
    return common;
  }, [activePlatform, note]);

  const payloadText = `标题：${note.title}\n\n${body}`;
  const weiboPayloadText = `标题：${note.title}\n\n${body}\n\n#自媒体#`;

  function selectNote(id){
    const next = NOTE_BY_ID.get(id);
    if(!next) return;
    setActiveNoteId(id);
    const first = PLATFORMS.find(p => next.platforms.includes(p.id));
    setActivePlatform(first?.id ?? "");
    setSelected(Object.fromEntries((defaultTargets[next.type] ?? []).filter(pid => next.platforms.includes(pid)).map(pid => [pid,true])));
  }

  function selectSourceType(type){
    if(type === sourceType) return;
    const first = NOTE_FIXTURES.find(item => item.type === type);
    if(first) selectNote(first.id);
  }

  function toggleDefault(type, id){
    setDefaultTargets(prev => {
      const current = prev[type] ?? [];
      const next = current.includes(id)
        ? current.filter(value => value !== id)
        : [...current, id];
      return {...prev, [type]:next};
    });
  }

  function toggleTheme(){
    const next = dark ? "light" : "dark";
    setTheme(next);
    localStorage.setItem("obsidian-publisher-theme", next);
  }

  function connectExtension(){
    if (extension === "waiting") {
      setExtension("disconnected");
      return;
    }
    setExtension("waiting");
    const t = setTimeout(() => setExtension("connected"), 1100);
    timers.current.push(t);
  }

  function startPublish(){
    if(blocked || running || selectedCount === 0) return;
    setRunning(true);
    setTasks(initialTasks());
    const next = initialTasks();
    PLATFORMS.forEach((p, index) => {
      if(!selected[p.id]) return;
      const stages = p.id === "zhihu"
        ? [["queued",4],["running",38],["running",82],["success",100]]
        : p.id === "wechat"
          ? [["queued",6],["running",32],["running",68],["waiting",100]]
          : p.id === "xhs"
            ? [["queued",6],["running",32],["running",68],["unknown",100]]
            : [["queued",6],["running",32],["running",68],["waiting_extension",100]];
      stages.forEach(([status, progress], stageIndex) => {
        const t = setTimeout(() => {
          setTasks(prev => ({
            ...prev,
            [p.id]: {
              status,
              stage:stageIndex,
              progress,
              url: status === "success" ? "https://zhuanlan.zhihu.com/p/29018473" : null,
              urlSource: status === "success" ? "auto" : null,
            },
          }));
        }, 350 + index*180 + stageIndex*680);
        timers.current.push(t);
      });
    });
    const done = setTimeout(() => setRunning(false), 3600);
    timers.current.push(done);
  }

  function confirmTask(id){
    setCompletion({id, url:"", noPublic:false});
  }

  function submitCompletion(){
    if(!completion) return;
    const url = completion.url.trim();
    if (!url && !completion.noPublic) return;
    setTasks(prev => ({...prev, [completion.id]:{...prev[completion.id], status:"success", progress:100, url:url || null, urlSource:"manual", noPublic:!url}}));
    setCompletion(null);
  }

  const statusText = {
    idle:"未发布", queued:"排队", running:"执行中", waiting:"等待完成", waiting_extension:"等待扩展", unknown:"结果未知", success:"完成", failed:"失败"
  };
  const visibleTasks = PLATFORMS.filter(p => tasks[p.id]?.status !== "idle");

  return (
    <div className="proto">
      <header className="proto-top">
        <strong>九漾 Onda · Obsidian 右侧面板</strong>
        <span>直接预览，底部一键发布</span>
        <div className="actions">
          <button className="ghost-btn active">右侧面板</button>
          <button className="ghost-btn" onClick={toggleTheme}>
            {icon(dark ? "sun" : "moon")}
            {dark ? "浅色" : "深色"}
          </button>
        </div>
      </header>

      <main className="stage">
        <section className="obsidian">
          <nav className="icon-rail">
            <button className="rail-dot active">{icon("files")}</button>
            <button className="rail-dot">{icon("search")}</button>
            <button className="rail-dot">{icon("settings")}</button>
          </nav>

          <aside className="vault">
            <h2>Content</h2>
            {TYPE_ORDER.map(type => {
              const notes = NOTE_FIXTURES.filter(item => item.type === type);
              return (
                <React.Fragment key={type}>
                  <div className="vault-group">{TYPE_META[type].zh}</div>
                  {notes.map(item => (
                    <button
                      key={item.id}
                      className={"file" + (item.id === note.id ? " active" : "")}
                      onClick={() => selectNote(item.id)}
                    >
                      <span className="glyph">MD</span>{item.file}
                    </button>
                  ))}
                </React.Fragment>
              );
            })}
          </aside>

          <section className="editor">
            <div className="editor-bar">
              <span>Content / {TYPE_META[note.type].zh} / {note.file}.md</span>
              <span style={{marginLeft:"auto"}}>已保存到磁盘 · Markdown · {note.body.length} 字</span>
            </div>
            <div className="editor-scroll">
              <h1 className="note-title">{note.title}</h1>
              <div className="note-meta">
                <span className="tag">id <b>{note.id}</b></span>
                <span className="tag">type <b>{note.type}</b></span>
                <span className="tag">platforms <b>{note.platforms.map(id => PLATFORMS.find(p => p.id === id)?.name).filter(Boolean).join(" · ")}</b></span>
              </div>
              <article className="note-body">
                {note.body.split(/\n\n+/).map((paragraph, index) => <p key={index}>{paragraph}</p>)}
                <NoteMedia note={note} />
              </article>
            </div>
          </section>

          <aside className="panel">
            <div className="panel-head">
              <div className="head-top">
                <div className="mark"><i></i><i></i><i></i><i></i></div>
                <h1>Publisher</h1>
                <button
                  className={`conn-indicator ${connectionState}`}
                  onClick={() => { if (backend === "connected" && extension !== "connected") connectExtension(); }}
                  title={connectionLabel}
                  aria-label={connectionLabel}
                >
                  <span className="dot"></span>
                </button>
                <button className="theme-btn" onClick={toggleTheme} title="切换主题">{icon(dark ? "sun" : "moon")}</button>
              </div>
              <div className="mode">
                <button className={mode === "preview" ? "active" : ""} onClick={() => setMode("preview")}>
                  {icon("search")} 预览
                </button>
                <button className={mode === "defaults" ? "active" : ""} onClick={() => setMode("defaults")}>
                  默认
                </button>
              </div>
            </div>

            <div className="panel-body">
              {mode === "preview" ? (
                <React.Fragment>
                  <div className="selector-card">
                    <div className="selector-row">
                      <span className="selector-label">类型</span>
                      <div className="type-options">
                        {TYPE_ORDER.map(type => {
                          const meta = TYPE_META[type];
                          return (
                            <button
                              key={type}
                              className={`type-option ${sourceType === type ? "active" : ""}`}
                              onClick={() => selectSourceType(type)}
                            >
                              {meta.zh}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                    <div className="selector-row">
                      <span className="selector-label">平台</span>
                      <div className="platform-options">
                        {supportedPlatforms.map(p => (
                          <button
                            key={p.id}
                            className={`platform-option ${selected[p.id] ? "selected" : ""}`}
                            style={{background:p.color, color:p.fg || "#fff"}}
                            title={`${p.name}${selected[p.id] ? " · 已选" : ""}`}
                            aria-label={`${selected[p.id] ? "移除" : "选择"} ${p.name}`}
                            aria-pressed={!!selected[p.id]}
                            onClick={() => {
                              setActivePlatform(p.id);
                              setSelected(prev => ({...prev, [p.id]:!prev[p.id]}));
                            }}
                          >
                            {p.short}
                          </button>
                        ))}
                      </div>
                    </div>
                    <div className="selector-summary">
                      <span className="count">
                        已选
                        <strong>{selectedCount}</strong>
                        <span className="total">/ {supportedCount}</span>
                      </span>
                      <span className="divider"></span>
                      <span className="summary-link" style={{cursor:"default"}}>点击图标切换发布目标</span>
                    </div>
                  </div>

                  <details
                    className="findings-panel"
                    open={findings.some(f => f.level === "error")}
                  >
                    <summary>转换检查</summary>
                    <div className="findings">
                      {findings.map((f, i) => (
                        <div key={i} className={`finding ${f.level}`}>
                          <span className="icon">{f.level === "ok" ? "✓" : f.level === "warn" ? "!" : "×"}</span>
                          <span>{f.text}</span>
                        </div>
                      ))}
                    </div>
                  </details>

                  <div className="preview-frame">
                    <div className="preview-content">
                      <PayloadAttachments items={note.type === "article" ? [] : note.media} compact />
                      {note.type === "article" ? (
                        <div className="rich">
                          <h4>{note.title}</h4>
                          {note.body.split(/\n\n+/).map((paragraph, index) => <p key={index}>{paragraph}</p>)}
                          <NoteMedia note={note} />
                          <p>文章保留图片在 Markdown 原文中的位置。</p>
                        </div>
                      ) : activePlatform === "jike" ? (
                        <div className="rich">
                          <h4>{note.title}</h4>
                          <p>{body}</p>
                          <p>有标题的想法平台使用 Markdown 首行 H1 作为平台标题。</p>
                        </div>
                      ) : (
                        <div className="plain">
                          {note.type === "image" && <p>图片按出现顺序组成图集，与所在段落无关。</p>}
                          {note.type === "video" && <p>视频作为主媒体上传。</p>}
                          {note.type === "audio" && <p>音频作为主媒体，发布时再选择节目或专辑。</p>}
                          {activePlatform === "weibo" ? weiboPayloadText : payloadText}
                        </div>
                      )}
                    </div>
                  </div>
                  {visibleTasks.length > 0 && (
                    <div className="task-strip" aria-label="发布状态">
                      {visibleTasks.map(p => {
                        const task = tasks[p.id];
                        const waiting = task.status === "waiting" || task.status === "waiting_extension" || task.status === "unknown";
                        return (
                          <button
                            key={p.id}
                            className={`task-chip ${waiting ? "waiting" : task.status}`}
                            onClick={() => {
                              if (waiting) confirmTask(p.id);
                              else if (task.status === "success" && task.url) window.open(task.url, "_blank", "noopener");
                            }}
                            title={waiting ? `补充 ${p.name} 的发布结果` : task.url || p.name}
                          >
                            <span className="glyph" style={{background:p.color,color:p.fg || "#fff"}}>{p.short}</span>
                            {p.name} · {statusText[task.status] || task.status}
                          </button>
                        );
                      })}
                    </div>
                  )}
                </React.Fragment>
              ) : mode === "defaults" ? (
                <React.Fragment>
                    <div className="selector-card">
                      <div className="selector-row">
                        <span className="selector-label">类型</span>
                        <div className="type-options">
                          {TYPE_ORDER.map(type => {
                            const meta = TYPE_META[type];
                            return (
                              <button
                                key={type}
                                className={`type-option ${sourceType === type ? "active" : ""}`}
                                onClick={() => selectSourceType(type)}
                              >
                                {meta.zh}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                      <div className="selector-row">
                        <span className="selector-label">平台</span>
                        <div className="platform-options">
                          {supportedPlatforms.map(p => {
                            const on = (defaultTargets[sourceType] ?? []).includes(p.id);
                            return (
                              <button
                                key={p.id}
                                className={`platform-option ${on ? "active selected" : ""}`}
                                style={{background:p.color, color:p.fg || "#fff"}}
                                title={p.name}
                                aria-label={`${on ? "移除" : "保存"} ${p.name} 为默认平台`}
                                aria-pressed={on}
                                onClick={() => toggleDefault(sourceType, p.id)}
                              >
                                {p.short}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                    <div className="notice">
                      这里只保存各稿件类型的默认勾选，不创建发布任务。
                    </div>
                </React.Fragment>
              ) : null}
            </div>

            {mode !== "defaults" && (
            <div className="panel-foot">
              <button className="primary-cta" disabled={blocked || running || selectedCount === 0} onClick={startPublish}>
                {blocked ? "发布通道暂不可用" : running ? "发布任务执行中…" : `发布到 ${selectedCount} 个平台`}
              </button>
              <div className="foot-note">{blocked ? "扩展连接后会自动继续" : "发布前会先保存当前 Markdown"}</div>
            </div>
            )}
          </aside>
        </section>
      </main>
      {completion && (
        <div className="modal-backdrop" onClick={() => setCompletion(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>补充发布结果</h3>
            <p>自动回执缺失时才需要手动处理。填写最终链接，或明确确认该结果没有公开链接。</p>
            <label htmlFor="publish-url">发布链接</label>
            <input
              id="publish-url"
              value={completion.url}
              placeholder="https://..."
              autoFocus
              onChange={e => setCompletion({...completion, url:e.target.value})}
            />
            <label className="completion-check">
              <input
                type="checkbox"
                checked={completion.noPublic}
                onChange={e => setCompletion({...completion, noPublic:e.target.checked, url:e.target.checked ? "" : completion.url})}
              />
              <span>该结果没有公开链接，我已在平台确认完成</span>
            </label>
            <div className="modal-actions">
              <button className="mini" onClick={() => setCompletion(null)}>取消</button>
              <button className="mini primary" disabled={!completion.url.trim() && !completion.noPublic} onClick={submitCompletion}>保存发布结果</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
