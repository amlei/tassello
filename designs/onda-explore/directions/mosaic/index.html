<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九漾 Onda · 方向 C · 色板 Mosaic</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232C6FF0'/%3E%3C/svg%3E">
<style>
:root{
  --blue:#2C6FF0;
  --magenta:#D52088;
  --orange:#FD8D11;
  --cyan:#0EC3D4;
  --green:#07B56F;
  /* 错误色只有一种：所有「出问题」的信号都归它，橙色因此回归成纯内容色（视频） */
  --error:#C81E4E;
  --ink:#16130E;
  --ink2:#5B554B;
  --paper:#FAFAF6;
  --card:#FFFFFF;
  --line:#16130E;
  --r-lg:22px;
  --r-md:18px;
  --r-sm:12px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  /* 标题只有两级（照 HIG 的 Title 1 / Title 2 分）：
     一级 = 这一屏的主体（栏目名、正在编辑的稿子）
     二级 = 面板标题（弹层、区块）
     两级共用字重与字距，只有字号不同 —— 层级靠字号差，不靠把字重往极端堆。 */
  --h1:28px;--h2:22px;
  --h-weight:700;--h-track:-0.4px;--h-leading:1.35;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body,#root{height:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
::-webkit-scrollbar{width:0;height:0}
/* 可滚动区留一条细滚动条：内容超出屏幕时看得见、够得着，而不是被无声裁掉 */
.m-main,.m-writecol,.m-phone-scroll{scrollbar-width:thin;scrollbar-color:rgba(22,19,14,.26) transparent}
.m-main::-webkit-scrollbar,.m-writecol::-webkit-scrollbar,.m-phone-scroll::-webkit-scrollbar{width:8px;height:8px}
.m-main::-webkit-scrollbar-thumb,.m-writecol::-webkit-scrollbar-thumb,.m-phone-scroll::-webkit-scrollbar-thumb{background:rgba(22,19,14,.18);border-radius:99px}
.m-main::-webkit-scrollbar-thumb:hover,.m-writecol::-webkit-scrollbar-thumb:hover,.m-phone-scroll::-webkit-scrollbar-thumb:hover{background:rgba(22,19,14,.32)}

/* ---------- app frame ---------- */
.m-app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.m-brand{display:flex;align-items:center;gap:14px}
.m-brand-name{font-size:22px;font-weight:900;letter-spacing:-0.5px}
.m-brand-sub{font-family:var(--mono);font-size:11px;color:var(--ink2);letter-spacing:1px;text-transform:uppercase}
/* 状态点：进行中 / 成功 / 失败，队列摘要用 */
.m-dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- logo mosaic ---------- */
.m-logo{display:grid;grid-template-columns:repeat(3,11px);grid-template-rows:repeat(3,11px);gap:2.5px}
.m-logo i{border-radius:3px;display:block}
.m-logo i.c{background:var(--ink)}

/* ---------- editor ---------- */
.m-editor{height:100%;display:flex;flex-direction:column}
.m-edbar{flex:0 0 60px;display:flex;align-items:center;gap:14px;padding:0 28px;background:var(--card)}
.m-backbtn{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px;transition:background .15s,color .15s}
.m-backbtn:hover{background:var(--ink);color:#fff}
.m-typechip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 14px;color:#fff;font-size:13px;font-weight:800}
.m-savestate{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--ink2)}
.m-savestate .dot{width:9px;height:9px;border-radius:3px;background:var(--green)}
.m-savestate.dirty .dot{background:var(--orange)}
.m-savestate.saving .dot{background:var(--blue);animation:m-pulse 0.8s infinite}
.m-wordcount{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.m-pubbtn{margin-left:auto;border:none;background:var(--green);color:#fff;border-radius:999px;padding:11px 26px;font-size:15px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:9px;transition:transform .15s,background .15s}
.m-pubbtn:hover{transform:translateY(-2px);background:#069e62}
.m-edbody{flex:1;min-height:0;display:grid;grid-template-columns:1fr 460px;gap:0}
/* 两栏各自滚动，容器负责裁切，并在底部托住一条「下面还有」的渐隐 */
.m-pane{position:relative;display:flex;min-height:0;overflow:hidden}
.m-writecol{flex:1;min-height:0;padding:34px 40px;overflow:auto;border-right:2px solid var(--line)}
.m-more{position:absolute;left:0;right:0;bottom:0;height:72px;pointer-events:none;z-index:4;transition:opacity .28s ease}
.m-pane:first-child .m-more{right:2px;background:linear-gradient(to bottom,rgba(250,250,246,0),#FAFAF6)}
.m-phone .m-more{height:56px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff)}
.m-more.off{opacity:0}
/* 标题：按 HIG 的层级做法 —— 字号、字重、颜色一起收。
   42px/900/-1.5px 是「海报」不是「文档标题」：打开一篇空稿先撞上一面巨字，压力很大。
   现在 28px/700/-0.4px，与正文 17px 仍差两档，层级没丢，语气降下来了。 */
.m-titlein{width:100%;border:none;border-bottom:2px solid transparent;outline:none;font-size:var(--h1);font-weight:var(--h-weight);letter-spacing:var(--h-track);line-height:var(--h-leading);padding:4px 0 12px;background:transparent;color:var(--ink);transition:border-color .2s}
.m-titlein:focus{border-bottom-color:var(--line)}
.m-titlein::placeholder{color:#8A8478}
.m-edwrap{position:relative;margin-top:22px}
.m-edpre,.m-edta{font-family:var(--font);font-size:17px;line-height:1.85;letter-spacing:0;padding:0;white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word}
/* 高度交给 pre 撑开，textarea 铺满其上 —— 正文区随内容增长，不再封在 300px 里留出一大块空档 */
.m-edpre{position:relative;min-height:300px;color:var(--ink);pointer-events:none}
/* 高亮层必须与 textarea 完全同宽同字重：加粗或补 padding 都会把光标顶偏 */
.m-edpre .tag{font-weight:inherit;border-radius:4px;padding:0;box-shadow:inset 0 -0.14em 0 rgba(0,0,0,.05)}
.m-edta{position:absolute;inset:0;width:100%;height:100%;border:none;outline:none;resize:none;background:transparent;color:transparent;caret-color:var(--ink);display:block}
.m-edta::placeholder{color:#8A8478}
/* 素材区：统一置顶、只占一条 —— 编辑页的主角是正文 */
.m-assetsec{margin:0 0 26px}
.m-assethead{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.m-assethead .sq{width:13px;height:13px;border-radius:4px}
.m-assethead .t{font-size:13px;font-weight:900}
.m-assethead .n{font-family:var(--mono);font-size:11px;color:var(--ink2)}
/* 缩略图一行排开：放不下时给一个收起/展开 icon，默认收起 */
.m-imgwrap{display:flex;align-items:center;gap:10px}
.m-imgrow{display:flex;flex:1;min-width:0;flex-wrap:nowrap;gap:8px;overflow:hidden}
.m-imgrow.open{flex-wrap:wrap;overflow:visible}
.m-imgcell{flex:0 0 auto;width:72px;height:72px;border-radius:10px;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;gap:3px;padding:6px;cursor:grab;transition:transform .18s,box-shadow .18s,opacity .18s}
.m-imgcell .n{font-family:var(--mono);font-size:10px;font-weight:700;color:rgba(255,255,255,.9)}
.m-imgcell.pickable{cursor:pointer}
.m-imgcell:hover{transform:translateY(-2px)}
.m-imgcell.dragging{opacity:.35;cursor:grabbing}
.m-imgcell.over{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.m-imgcell.add{background:#fff;border:2px dashed #B9B3A6;color:var(--ink2);align-items:center;justify-content:center;cursor:pointer}
.m-imgcell.add .cap{font-size:10px;font-weight:800}
.m-imgcell.add:hover{border-color:var(--ink);color:var(--ink);transform:none}
.m-imgtoggle{flex:0 0 auto;width:28px;height:28px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s}
.m-imgtoggle:hover{background:var(--ink);color:#fff}
.m-edpre .mdimg,.m-phone .body .mdimg{color:#B9B3A6;background:#F1EFE8;border-radius:4px}
.m-cover{width:196px;aspect-ratio:16/9;border-radius:12px;background:var(--ink);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.m-cover .badge{position:absolute;top:8px;left:8px;background:var(--orange);color:#fff;font-family:var(--mono);font-size:9.5px;padding:3px 8px;border-radius:999px;font-weight:700}
.m-cover .dur{position:absolute;bottom:8px;right:9px;color:#fff;font-family:var(--mono);font-size:10px}
.m-playbig{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;border:none;transition:transform .15s}
.m-playbig:hover{transform:scale(1.08)}
.m-audiobar{background:var(--ink);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px;max-width:440px}
.m-audioplay{width:34px;height:34px;border-radius:50%;background:var(--cyan);border:none;display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:transform .15s}
.m-audioplay:hover{transform:scale(1.08)}
.m-audiotrack{flex:1}
.m-audiotime{font-family:var(--mono);font-size:10px;color:#8FCCDB;display:flex;justify-content:space-between;margin-bottom:6px}
.m-audioline{height:5px;border-radius:3px;background:#33302A;position:relative;overflow:hidden}
.m-audioline i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);border-radius:3px;display:block}

/* ---------- preview column ---------- */
.m-prevcol{flex:1;min-height:0;background:#F1EFE8;padding:22px 28px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
/* 手机屏高度固定：只有正文在屏内滚，标题 / 素材 / 页脚都留在屏上 */
.m-phone{position:relative;background:#fff;border:2px solid var(--line);border-radius:26px;max-width:380px;max-height:640px;width:100%;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.m-phone-head{display:flex;align-items:center;gap:9px;flex:0 0 auto;padding:18px 20px 14px;border-bottom:1.5px solid #EEECE4}
.m-phone-title{flex:0 0 auto;font-size:19px;font-weight:var(--h-weight);line-height:1.4;letter-spacing:-0.2px;margin:16px 20px 0}
.m-phone-body{position:relative;flex:1;min-height:0;display:flex}
.m-phone-scroll{flex:1;min-height:0;overflow:auto;padding:10px 20px 8px}
.m-phone-media{flex:0 0 auto;padding:4px 20px 0}
.m-phone-head .av{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:900}
.m-phone-head .who{font-size:13px;font-weight:var(--h-weight)}
.m-phone-head .when{font-family:var(--mono);font-size:10px;color:var(--ink2)}
.m-phone .body{font-size:14px;line-height:1.85;color:#2A2620}
.m-phone .body .tag{font-weight:800;border-radius:5px;padding:0 2px}
/* 贴图预览：一行排开，单张更小 */
.m-phone .pimgs{display:flex;gap:6px}
.m-phone .pimgs i{flex:1 1 0;min-width:0;max-width:74px;aspect-ratio:1;border-radius:8px;display:block}
.m-phone .pimgblock{aspect-ratio:16/9;border-radius:10px;margin:2px 0 10px;background:#E4E0D4;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:var(--ink2)}
.m-phone .pcover{aspect-ratio:16/9;border-radius:12px;background:var(--ink);display:flex;align-items:center;justify-content:center;position:relative}
.m-phone .pcover .tri{width:0;height:0;border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.m-phone .pcover .d{position:absolute;bottom:8px;right:10px;color:#fff;font-family:var(--mono);font-size:10px}
.m-phone .paudio{background:#F1EFE8;border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px}
.m-phone .paudio .btn{width:30px;height:30px;border-radius:50%;background:var(--ink);flex:0 0 auto;position:relative}
.m-phone .paudio .btn::after{content:"";position:absolute;left:11px;top:8px;border-left:10px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent}
.m-phone .paudio .ln{flex:1;height:5px;border-radius:3px;background:#DDD9CD;position:relative}
.m-phone .paudio .ln i{position:absolute;left:0;top:0;bottom:0;width:32%;background:var(--cyan);border-radius:3px;display:block}
.m-phone .paudio .tm{font-family:var(--mono);font-size:10px;color:var(--ink2)}
.m-phone .foot{flex:0 0 auto;margin:10px 20px 0;padding:12px 0 20px;border-top:1.5px solid #EEECE4;font-family:var(--mono);font-size:10px;color:var(--ink2);display:flex;gap:12px}

/* ---------- publish sheet ---------- */
.m-overlay{position:fixed;inset:0;background:rgba(22,19,14,.5);display:flex;align-items:center;justify-content:center;z-index:60;animation:m-fade .18s}
.m-sheet{background:var(--paper);border:2px solid var(--line);border-radius:26px;width:760px;max-width:92vw;padding:30px 34px 28px;animation:m-pop .22s cubic-bezier(.2,.8,.3,1.2)}
.m-sheet-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.m-sheet-head h2{font-size:var(--h2);font-weight:var(--h-weight);letter-spacing:-0.2px;line-height:var(--h-leading)}
.m-sheet-head .sel{font-family:var(--mono);font-size:13px;color:var(--ink2);margin-left:auto}
.m-typechip-sm{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 12px;color:#fff;font-size:12px;font-weight:800}
.m-sheet-sub{font-size:14px;color:var(--ink2);margin-bottom:22px}
/* 平台墙：一个方块就是一个平台 icon，只带状态，不带名称 */
.m-platwall{display:flex;flex-wrap:wrap;gap:16px;padding:4px 6px 8px}
.m-platico{position:relative;width:56px;height:56px;border-radius:16px;border:none;display:flex;align-items:center;justify-content:center;font-family:var(--font);font-size:19px;font-weight:900;cursor:pointer;transition:transform .16s cubic-bezier(.2,.7,.3,1),box-shadow .16s,opacity .16s}
.m-platico:hover{transform:translateY(-3px)}
.m-platico.sm{width:38px;height:38px;border-radius:12px;font-size:14px}
.m-platico.sm .m-platck{width:16px;height:16px;border-radius:5px;top:-5px;right:-5px}
.m-platico.sm .m-platretry{width:16px;height:16px;bottom:-5px;right:-5px;border-width:1.5px}
.m-platico.fail,.m-platico.muted{background:#F1EFE8 !important;color:#A9A294 !important}
.m-platico.fail:hover,.m-platico.muted:hover{transform:none}
.m-platretry{position:absolute;bottom:-7px;right:-7px;width:21px;height:21px;border-radius:7px;background:#fff;border:2px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center}
.m-platck{position:absolute;top:-7px;right:-7px;width:21px;height:21px;border-radius:7px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;animation:m-pop .25s}
/* 约束预检：这篇稿子在该平台会超限，选前就说清 */
/* 放左上角：右上角留给「已选」的对勾，两个标记不会打架 */
.m-platdot{position:absolute;top:-3px;left:-3px;width:13px;height:13px;border-radius:50%;background:var(--error);border:2.5px solid var(--paper)}
/* 默认发布平台：每种稿子一条单独的横带。
   之前只靠行间距分开，上一行的选中勾仍会贴到下一行的方块上；
   现在每条带子自己有上下留白 + 一条细线，四类之间彻底分开 */
.m-typerows{display:flex;flex-direction:column;gap:0}
.m-typerow{display:flex;align-items:center;gap:16px;padding:18px 0;border-top:1.5px solid #EEECE4}
.m-typerow:first-child{padding-top:4px;border-top:none}
.m-typerow:last-child{padding-bottom:4px}
.m-trowlabel{display:inline-flex;align-items:center;gap:8px;width:74px;flex:0 0 auto;font-size:14px;font-weight:900}
.m-trowlabel .sq{width:13px;height:13px;border-radius:4px}
.m-trowicons{display:flex;flex-wrap:wrap;gap:10px}
.m-sheet-foot{display:flex;align-items:center;gap:14px;margin-top:30px}
.m-sheet-foot .cnt{font-family:var(--mono);font-size:13px;color:var(--ink2)}
.m-ghostbtn{border:2px solid var(--line);background:transparent;border-radius:999px;padding:12px 24px;font-size:15px;font-weight:800;margin-left:auto;transition:background .15s,color .15s}
.m-ghostbtn:hover{background:var(--ink);color:#fff}
.m-confirmbtn{border:none;background:var(--green);color:#fff;border-radius:999px;padding:13px 30px;font-size:16px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:9px;transition:transform .15s,opacity .15s}
.m-confirmbtn:hover{transform:translateY(-2px)}
.m-confirmbtn:disabled{opacity:.35;cursor:not-allowed;transform:none}

/* ---------- tasks：单栏队列 ---------- */
.m-tasks{padding:0}
.m-tsummary{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink2);margin-bottom:18px}
.m-tsummary b{color:var(--ink);font-size:15px;margin-left:5px}
.m-tsummary .m-thint{margin-left:auto;color:#8A8478}
.m-tlist{display:flex;flex-direction:column;gap:10px}
/* 一篇稿子一行：稿子在左，这一轮发到的平台在右，状态就长在方块上 */
.q-item{padding:11px 16px;background:#fff;border:2px solid var(--line);border-radius:var(--r-md);transition:transform .18s cubic-bezier(.2,.7,.3,1)}
.q-item:hover{transform:translateY(-2px)}
.q-head{display:flex;align-items:center;gap:14px;min-height:46px}
.q-sq{flex:0 0 14px;width:14px;height:14px;border-radius:4px;display:block}
.q-title{flex:0 1 auto;min-width:0;max-width:38%;border:none;background:transparent;padding:0;text-align:left;font-size:15px;font-weight:var(--h-weight);letter-spacing:-0.2px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-title:hover{text-decoration:underline}
.q-title:disabled{cursor:default;color:var(--ink2)}
.q-icons{flex:0 0 auto;display:flex;align-items:center;gap:14px;margin-left:6px}
.q-meta{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11px;color:var(--ink2)}

/* 平台方块：一枚方块顶原来一整行 */
.q-tile{position:relative;flex:0 0 auto;width:46px;height:46px;border:2px solid var(--line);border-radius:14px;padding:0;font-family:inherit;font-size:16px;font-weight:900;line-height:1;text-decoration:none;display:block;transition:transform .16s cubic-bezier(.2,.7,.3,1)}
.q-tile:hover{transform:translateY(-3px)}
/* 内层负责裁剪，角标挂在外层，才不会被裁掉 */
.q-body{position:absolute;inset:0;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.q-body .ch{position:relative;z-index:2}
.q-tile .badge{position:absolute;z-index:3;display:flex;align-items:center;justify-content:center;border:2px solid #fff;border-radius:7px;font-family:var(--mono);font-weight:800}
.q-tile .badge.ok,.q-tile .badge.bad{right:-6px;top:-6px;width:19px;height:19px;color:#fff}
.q-tile .badge.ok{background:var(--green)}
.q-tile .badge.bad{background:var(--error)}
.q-tile .badge.pct{right:-7px;bottom:-7px;min-width:20px;height:17px;padding:0 5px;background:var(--ink);color:#fff;font-size:9.5px;border-radius:6px}

/* 进行中：水位从底部涨上来，字随水位从下往上漂白 */
.q-tile.running{background:#F1EFE8;color:var(--pc);cursor:default}
.q-tile.running:hover{transform:none}
.q-tile.running .fill{position:absolute;left:0;right:0;bottom:0;background:var(--pc);z-index:1;transition:height .55s cubic-bezier(.2,.7,.3,1)}
/* 两层同宽椭圆叠出水面：一层定形，一层缓慢平移做波纹 */
.q-tile.running .fill::before,.q-tile.running .fill::after{content:"";position:absolute;left:-60%;width:220%;height:12px;border-radius:50%;background:var(--pc)}
.q-tile.running .fill::before{top:-6px;opacity:.95}
.q-tile.running .fill::after{top:-3px;opacity:.55;animation:q-wave 3.6s ease-in-out infinite}
.q-tile.running .fill .chfill{position:absolute;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;justify-content:center;color:var(--fg);z-index:1;font-weight:900}

/* 已发布：整块就是链接 */
.q-tile.ok{background:var(--pc);color:var(--fg)}
/* 出问题：整块换成错误色，点一下重试 */
.q-tile.bad{background:var(--error);color:#fff;cursor:pointer}
/* 错误条按内容收紧，别拉成一条横贯整行的空带子 */
.q-err{display:flex;align-items:center;gap:9px;width:fit-content;max-width:100%;margin-top:9px;padding:8px 12px;background:#FDF1F4;border:1.5px solid #F2C2D1;border-radius:11px;color:var(--error)}
.q-errtxt{min-width:0;font-size:12.5px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-errtxt b{font-weight:900}
.q-retry{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--error);background:#fff;border-radius:999px;padding:3px 11px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--error);transition:background .15s,color .15s}
.q-retry:hover{background:var(--error);color:#fff}
@keyframes q-wave{0%,100%{transform:translateX(-3%)}50%{transform:translateX(3%)}}
.m-emptybox{border:2px dashed #C9C4B8;border-radius:var(--r-md);padding:22px;text-align:center;color:var(--ink2);font-size:13px;font-family:var(--mono)}

/* ---------- floating pill ---------- */
.m-pill{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:50;background:var(--ink);color:#fff;border-radius:999px;padding:13px 22px;display:flex;align-items:center;gap:14px;font-size:14px;font-weight:800;border:none;animation:m-rise .3s cubic-bezier(.2,.8,.3,1.2)}
.m-pill:hover{background:#000}
.m-pill .sqs{display:flex;gap:4px}
.m-pill .sqs i{width:10px;height:10px;border-radius:3px;display:block;animation:m-pulse 1.1s infinite}
.m-pill .sqs i:nth-child(2){animation-delay:.18s}
.m-pill .sqs i:nth-child(3){animation-delay:.36s}
.m-pill .mono{font-family:var(--mono);font-size:12px;color:#9AF0C9}

@keyframes m-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes m-fade{from{opacity:0}to{opacity:1}}
@keyframes m-pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes m-rise{from{opacity:0;transform:translateX(-50%) translateY(24px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

/* ==================================================================
   工作台骨架 —— 左栏定类型，主区是一条可以无限长的列表
   类型是颜色与筛选维度，不再是布局结构；预览按需从行内按钮唤起。
   ================================================================== */
.w-shell{flex:1;min-height:0;display:flex;overflow:hidden;background:var(--paper)}

/* ---------- 左侧栏 ---------- */
.w-rail{flex:0 0 236px;min-height:0;display:flex;flex-direction:column;gap:14px;padding:18px 14px 14px;background:var(--card);border-right:2px solid var(--line)}
.w-rail .m-brand{gap:11px;padding:0 8px}
.w-rail .m-brand-name{font-size:18px;letter-spacing:-0.3px}
.w-rail .m-brand-sub{font-size:9.5px;letter-spacing:0.8px}
.w-nav{display:flex;flex-direction:column;gap:3px}
/* width:100% 是必要的：按钮在块级容器里会按内容收缩，设置那一行因此只剩半行可点 */
.w-navitem{width:100%;display:grid;grid-template-columns:14px minmax(0,1fr) auto;align-items:center;gap:10px;border:2px solid transparent;background:transparent;border-radius:12px;padding:8px 10px;font-size:15px;font-weight:800;color:var(--ink);text-align:left;transition:background .15s,color .15s}
.w-navitem:hover{background:#F1EFE8}
.w-navitem.on{background:var(--ink);color:#fff}
.w-navitem:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.w-sq{width:14px;height:14px;border-radius:4px;display:block}
.w-navn{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink2)}
.w-navitem.on .w-navn{color:#B9B3A6}
.w-navitem .w-badge{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--green);color:#fff;border-radius:999px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
/* 四类之下才是次要入口：一条分隔线，字号收一档 */
.w-navsub{margin-top:2px;padding-top:12px;border-top:1.5px solid #E4E0D4;display:flex;flex-direction:column;gap:3px}
.w-navsub .w-navitem{font-size:14px;padding:7px 10px}
/* 栏底：设置一个人占一行。凭据都拿到时它不带任何标记 */
.w-railtail{margin-top:auto;padding-top:12px;border-top:1.5px solid #E4E0D4}
.w-attn{font-family:var(--mono);font-size:10.5px;font-weight:700;color:#fff;background:var(--error);border-radius:999px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}

/* ---------- 主区 ---------- */
.w-stage{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.w-view{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
/* 头部与列表共用同一条内容列：两边同时收窄、同时居中，右上角的工具才不会飘在列表之外 */
.w-canvas{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:1560px;margin:0 auto}
.w-head{flex:0 0 auto;display:flex;align-items:flex-end;gap:16px;padding:26px 34px 16px;flex-wrap:wrap}
.w-headline{display:flex;align-items:baseline;gap:12px;min-width:0}
.w-h1{font-size:var(--h1);font-weight:var(--h-weight);letter-spacing:var(--h-track);line-height:var(--h-leading)}
.w-hmeta{font-family:var(--mono);font-size:11.5px;color:var(--ink2);letter-spacing:.5px;white-space:nowrap}
.w-tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.w-search{display:flex;align-items:center;gap:8px;width:210px;padding:8px 14px;background:#fff;border:2px solid var(--line);border-radius:999px;color:var(--ink2);transition:width .22s cubic-bezier(.2,.7,.3,1)}
.w-search:focus-within{width:290px;color:var(--ink)}
.w-search input{width:100%;border:none;outline:none;background:transparent;font-size:14px;color:var(--ink)}
.w-search input::placeholder{color:#A9A294}
.w-srchclear{flex:0 0 auto;width:18px;height:18px;border:none;border-radius:6px;background:#E4E0D4;color:var(--ink2);display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.w-srchclear:hover{background:var(--ink);color:#fff}
.w-sort{position:relative}
.w-ghostbtn{display:flex;align-items:center;gap:7px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:800;color:var(--ink);white-space:nowrap;transition:background .15s,color .15s}
.w-ghostbtn:hover{background:var(--ink);color:#fff}
.w-new{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:900;color:#fff;white-space:nowrap;transition:transform .15s,filter .15s}
.w-new:hover{transform:translateY(-2px);filter:brightness(1.06)}
/* 下拉菜单：排序、以及在「全部稿子」里挑类型新建 */
.w-menu{position:absolute;top:calc(100% + 8px);right:0;z-index:30;min-width:160px;display:flex;flex-direction:column;gap:2px;padding:6px;background:#fff;border:2px solid var(--line);border-radius:14px;animation:m-pop .16s}
.w-menu.left{left:0;right:auto}
.w-menuitem{display:flex;align-items:center;gap:9px;border:none;background:transparent;border-radius:9px;padding:8px 10px;font-size:13.5px;font-weight:700;color:var(--ink);text-align:left;transition:background .12s}
.w-menuitem:hover{background:#F1EFE8}
.w-menuitem.on{background:var(--ink);color:#fff}
.w-backdrop{position:fixed;inset:0;z-index:25;border:none;background:transparent}

/* ---------- 列表 ---------- */
.w-scroll{flex:1;min-height:0;overflow:auto;padding:0 34px 120px}
/* 列表跟着内容列走，不再单独收窄 —— 之前在宽窗口右侧留出一大片空槽 */
.w-list{display:flex;flex-direction:column;gap:10px}
.w-row{display:flex;align-items:center;gap:14px;padding:15px 17px;background:#fff;border:2px solid var(--line);border-radius:var(--r-md);cursor:pointer;transition:transform .18s cubic-bezier(.2,.7,.3,1)}
.w-row:hover{transform:translateY(-3px)}
.w-row:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* 固定宽度：混排时四类标签长度不同（ARTICLE / IMAGES），不定宽标题就会左右跳 */
.w-kind{flex:0 0 86px;display:inline-flex;align-items:center;gap:7px}
.w-kindtxt{font-family:var(--mono);font-size:10.5px;color:var(--ink2);letter-spacing:.8px}
.w-rowmain{flex:1;min-width:0}
.w-rowtitle{font-size:17px;font-weight:var(--h-weight);letter-spacing:-0.2px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-rowexcerpt{margin-top:3px;font-size:13px;color:var(--ink2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.w-rowmeta{flex:0 0 auto;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
.w-dur{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-family:var(--mono);font-size:11px;font-weight:700}
.w-live{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--blue)}
.w-live i{width:9px;height:9px;border-radius:3px;background:currentColor;display:block;animation:m-pulse 1.1s infinite}
.w-rowacts{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.w-icon{width:30px;height:30px;border:2px solid var(--line);border-radius:9px;background:#fff;color:var(--ink2);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s,background .15s,color .15s}
.w-row:hover .w-icon,.w-icon:focus-visible{opacity:1}
.w-icon:hover{background:var(--ink);color:#fff}
.w-icon.confirm{opacity:1;width:auto;padding:0 10px;background:#C81E4E;border-color:#C81E4E;color:#fff;font-family:var(--mono);font-size:11px;font-weight:800}
/* 格子里没有 hover 出来的空间，动作常态悬浮在封面右上角 */
.w-coverwrap{position:relative}
.w-tileacts{position:absolute;right:7px;top:7px;z-index:2;display:flex;gap:5px;opacity:0;transition:opacity .15s}
.w-tile:hover .w-tileacts,.w-tile:focus-within .w-tileacts{opacity:1}
.w-tileacts .w-icon{width:27px;height:27px;border-radius:9px;opacity:1;background:rgba(255,255,255,.94)}
/* 贴图与视频：格子而不是行 —— 内容的形状决定版式 */
.w-grid{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px}
.w-tile{display:flex;flex-direction:column;gap:10px;padding:12px;background:#fff;border:2px solid var(--line);border-radius:var(--r-md);cursor:pointer;transition:transform .2s cubic-bezier(.2,.7,.3,1)}
.w-tile:hover{transform:translateY(-4px)}
.w-tile:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* 长按拖动：按下先收一下，拎起来之后脱离网格、跟着指针走 */
.w-tile.pressing{transform:scale(.975)}
.w-tile.dragging{cursor:grabbing;z-index:12;transition:none;transform-origin:50% 50%;box-shadow:0 14px 26px rgba(22,19,14,.22)}
.w-tile.dragging .w-tileacts{opacity:0}
.w-grid.reordering{cursor:grabbing}
body.w-dragging,body.w-dragging *{user-select:none;cursor:grabbing}
.w-tilemain{display:flex;flex-direction:column;gap:4px;min-width:0}
.w-tiletitle{font-size:15px;font-weight:var(--h-weight);letter-spacing:-0.2px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.w-tilemeta{font-family:var(--mono);font-size:10.5px;color:var(--ink2);display:flex;gap:9px;align-items:center}
/* 贴图封面 = Logo 的九宫格语言放大：满格拼贴，张数写在角上 */
.w-mosaic{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:#F1EFE8}
.w-mosaic i{display:block}
.w-mosaic .w-count{position:absolute;right:7px;bottom:6px;font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;background:rgba(22,19,14,.62);border-radius:999px;padding:2px 8px}
.w-vcover{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;border-radius:10px;background:var(--ink);overflow:hidden}
.w-vcover .tri{width:0;height:0;margin-left:4px;border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;opacity:.92}
.w-vcover .dur{position:absolute;right:8px;bottom:7px;font-family:var(--mono);font-size:10px;color:#fff}
.w-vcover .badge{position:absolute;left:8px;top:7px;font-family:var(--mono);font-size:9px;color:#fff;background:var(--orange);border-radius:999px;padding:2px 7px}
.w-empty{padding:44px;border:2px dashed #C9C4B8;border-radius:var(--r-md);text-align:center;font-family:var(--mono);font-size:13px;color:var(--ink2)}

/* ---------- 预览弹窗：右侧不常驻，按钮唤起 ---------- */
.w-pv{width:520px;max-width:92vw;max-height:calc(100vh - 56px);display:flex;flex-direction:column;padding:20px 22px 18px;background:var(--paper);border:2px solid var(--line);border-radius:26px;animation:m-pop .22s cubic-bezier(.2,.8,.3,1.2)}
.w-pv-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.w-pv-head .t{flex:1;min-width:0;font-size:17px;font-weight:var(--h-weight);letter-spacing:-0.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-pv-head .k{font-family:var(--mono);font-size:10.5px;color:var(--ink2);letter-spacing:.8px}
.w-pv-body{flex:1;min-height:0;display:flex;justify-content:center;overflow:auto;padding:2px 0 4px}
.w-pv-body .m-phone{max-height:min(640px,calc(100vh - 250px))}
.w-pv-foot{flex:0 0 auto;display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1.5px solid #E4E0D4}
.w-pv-hint{font-family:var(--mono);font-size:11px;color:var(--ink2)}
.w-pv-foot .w-ghostbtn{margin-left:auto}
/* 主动作统一用墨色：绿色在这套语言里专属于「发布成功」 */
.w-primary{border:none;background:var(--ink);color:#fff;border-radius:999px;padding:11px 22px;font-size:15px;font-weight:900;letter-spacing:.5px;transition:transform .15s}
.w-primary:hover{transform:translateY(-2px)}

/* ---------- 设置：平台账号 + 默认发布名单 ---------- */
.w-set{width:780px;max-height:calc(100vh - 72px);display:flex;flex-direction:column}
.w-setscroll{flex:1;min-height:0;overflow:auto;padding-right:6px;margin-top:8px}
/* 上下留够气口：账号行之间、段落之间、列表行之间都拉开 */
.w-setsec + .w-setsec{margin-top:30px;padding-top:26px;border-top:1.5px solid #E4E0D4}
.w-setsec h4{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:var(--h-weight);letter-spacing:-0.2px;margin-bottom:14px}
.w-setn{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink2)}
.w-setnote{font-size:12.5px;color:var(--ink2);line-height:1.8;margin-bottom:18px}
.w-accts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.w-acct{display:flex;align-items:center;gap:10px;padding:11px 12px;background:#fff;border:1.5px solid #E4E0D4;border-radius:12px;transition:border-color .15s,background .15s}
.w-acct:hover{border-color:#C9C4B8}
.w-acct.active{border-color:var(--ink);background:#FBFBF7}
.w-acct.fail{background:#FAF8F2}
.w-acct .w-sq{flex:0 0 14px;width:14px;height:14px;border-radius:4px;display:block}
.w-acctname{flex:0 0 auto;font-size:13.5px;font-weight:800;letter-spacing:-0.1px}
.w-acctwho{flex:1;min-width:0;font-size:11.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-acctchev{flex:0 0 auto;display:flex;color:var(--ink2)}

/* 凭据卡：浮在设置弹窗外侧，左列账号往左、右列往右，不挤压下面的名单 */
.w-acctpop{position:fixed;z-index:70;padding:16px 18px 18px;background:#fff;border:2px solid var(--line);border-radius:18px;animation:m-pop .18s cubic-bezier(.2,.8,.3,1.2)}
.w-acctpop::after{content:"";position:absolute;top:26px;width:12px;height:12px;background:#fff;border:2px solid var(--line);transform:rotate(45deg)}
.w-acctpop.left::after{right:-8px;border-left:none;border-bottom:none}
.w-acctpop.right::after{left:-8px;border-right:none;border-top:none}
.w-acctpop-head{display:flex;align-items:center;gap:9px;padding-bottom:12px;border-bottom:1.5px solid #EEECE4}
.w-acctpop-head .w-sq{flex:0 0 14px;width:14px;height:14px;border-radius:4px;display:block}
.w-acctpop-head .t{flex:1;min-width:0;font-size:14px;font-weight:var(--h-weight);letter-spacing:-0.2px}
.w-acctpop-x{flex:0 0 auto;width:22px;height:22px;border:1.5px solid #E4E0D4;border-radius:8px;background:#fff;color:var(--ink2);display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.w-acctpop-x:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.w-acctpop-body{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.w-acctpop-acc{display:flex;align-items:center;gap:12px}
.w-acctpop-who{min-width:0}
.w-acctpop-who .n{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:var(--h-weight);letter-spacing:-0.2px}
.w-acctpop-who .u{margin-top:3px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-acctrows{display:flex;flex-direction:column;gap:10px;margin:0}
.w-acctrows dt{font-family:var(--mono);font-size:10.5px;color:#8A8478;margin-bottom:3px}
.w-acctrows dd{font-size:12.5px;line-height:1.7;color:var(--ink)}
.w-avatar{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900}
.w-acctkind{font-family:var(--mono);font-size:10.5px;color:var(--ink2);border:1.5px solid #DCD7C9;border-radius:999px;padding:1px 8px}
.w-accterr{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;line-height:1.65;color:var(--error)}
.w-statchip{flex:0 0 auto;font-family:var(--mono);font-size:10px;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:2px 9px}
.w-statchip.ok{color:var(--green);border-color:#B7E3CD}
.w-statchip.bad{color:var(--error);border-color:#F2C2D1}
.w-relink{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink);transition:background .15s,color .15s}
.w-relink:hover{background:var(--ink);color:#fff}

</style>
</head>
