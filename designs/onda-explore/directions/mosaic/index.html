<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九漾 Onda · 中性工作台 · Mosaic</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232383E2'/%3E%3C/svg%3E">
<script>
/* 主题防闪烁：body 渲染前按偏好落 data-theme，并常驻跟随系统（与 apps/web/components/theme.tsx 同源） */
(function(){try{var K="onda-theme";var pref=function(){var v=null;try{v=localStorage.getItem(K);}catch(e){}return v==="light"||v==="dark"?v:"system";};var apply=function(){var p=pref();var d=p==="dark"||(p==="system"&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";};apply();window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){if(pref()==="system")apply();});}catch(e){}})();
</script>
<style>
/* ==================================================================
   方向 B · 中性工作台 —— 白底、发丝线、一个功能蓝。
   类型色只出现在小面积（方块 / chip）；骨架灰阶随主题翻转。
   ================================================================== */
:root{
  /* 内容类型色：只在小面积出现 */
  --blue:#2C6FF0;
  --magenta:#D52088;
  --orange:#FD8D11;
  --cyan:#0EC3D4;
  --green:#07B56F;
  /* 错误色只有一种：所有「出问题」的信号都归它，橙色因此回归成纯内容色（视频） */
  --error:#C81E4E;
  --error-soft:#FDF1F4;
  --error-line:#F2C2D1;
  /* 骨架灰阶：三档中性灰 + 结构色 */
  --ink:#37352F;
  --ink2:#787672;
  --ink3:#ABA9A4;
  --paper:#FFFFFF;
  --card:#FFFFFF;
  --rail:#FBFBFA;
  --line:#EDECE9;
  --hover:#F4F3F1;
  --selected:#F1F0EE;
  /* 交互蓝：链接/焦点/主按钮，唯一强调色 */
  --accent:#2383E2;
  --accent-tint:#E9F3FB;
  /* 单色品牌（X）的品牌色跟主题翻转：亮色黑标、深色白标 */
  --plat-x:#16130E;
  --plat-x-fg:#FFFFFF;
  --shadow-card:0 1px 2px rgba(15,15,15,.04);
  --shadow-tile:0 3px 10px rgba(15,15,15,.07);
  --shadow-pop:0 14px 40px rgba(15,15,15,.14);
  --backdrop:rgba(15,15,15,.46);
  --r-lg:20px;
  --r-md:14px;
  --r-sm:10px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  /* 标题只有两级（照 HIG 的 Title 1 / Title 2 分）：
     一级 = 这一屏的主体（栏目名、正在编辑的稿子）
     二级 = 面板标题（弹层、区块）
     两级共用字重与字距，只有字号不同 —— 层级靠字号差，不靠把字重往极端堆。 */
  --h1:28px;--h2:22px;
  --h-weight:700;--h-track:-0.4px;--h-leading:1.35;
  /* 窗口壳契约：TitleBar 只负责窗口控制、品牌和拖拽；内容层不再模拟标题栏。
     原型用假红绿灯表达 macOS 占位；真实桌面里这里是系统控件 + safe-area token。 */
  --titlebar-h:46px;
  --traffic-safe:76px;
  --control-size:30px;
  --rail-width:236px;
}
[data-theme="dark"]{
  --error:#E5484D;
  --error-soft:rgba(229,72,77,.12);
  --error-line:rgba(229,72,77,.38);
  --ink:#E6E5E3;
  --ink2:#9B9A97;
  --ink3:#6F6E69;
  --paper:#191919;
  --card:#252525;
  --rail:#202020;
  --line:#2F2F2F;
  --hover:#2A2A2A;
  --selected:#2F2F2F;
  --accent:#4A9EE8;
  --accent-tint:#20304A;
  --plat-x:#E6E5E3;
  --plat-x-fg:#191919;
  --shadow-card:0 1px 2px rgba(0,0,0,.3);
  --shadow-tile:0 3px 10px rgba(0,0,0,.45);
  --shadow-pop:0 14px 40px rgba(0,0,0,.5);
  --backdrop:rgba(0,0,0,.6);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body,#root{height:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea{font-family:inherit}
::-webkit-scrollbar{width:0;height:0}
/* 可滚动区留一条细滚动条：内容超出屏幕时看得见、够得着，而不是被无声裁掉
   （手机预览区除外 —— 预览按手机交互模式，滚动条一律隐藏，靠手势/滚轮） */
.m-main,.m-writecol{scrollbar-width:thin;scrollbar-color:var(--ink3) transparent}
.m-main::-webkit-scrollbar,.m-writecol::-webkit-scrollbar{width:8px;height:8px}
.m-main::-webkit-scrollbar-thumb,.m-writecol::-webkit-scrollbar-thumb{background:var(--ink3);border-radius:99px}
.m-main::-webkit-scrollbar-thumb:hover,.m-writecol::-webkit-scrollbar-thumb:hover{background:var(--ink2)}
.m-phone-scroll,.m-phone .pimgs{scrollbar-width:none}
.m-phone-scroll::-webkit-scrollbar,.m-phone .pimgs::-webkit-scrollbar{display:none}

/* ---------- app frame ---------- */
.m-app{height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ---------- WorkspaceShell / TitleBar ---------- */
/* 全局唯一窗口栏：左段是系统控制安全区和侧栏开关，随后是当前视图上下文；右段留给未来全局状态。
   页面头部只表达当前视图内容，不承担 app-region / 红绿灯让位职责。 */
.w-titlebar{flex:0 0 var(--titlebar-h);display:flex;align-items:center;gap:10px;min-width:0;padding:0 12px 0 10px;background:var(--rail);border-bottom:1px solid var(--line)}
.tb-lights{flex:0 0 auto;display:flex;align-items:center;gap:8px;width:52px;color:var(--ink3)}
.tb-lights i{width:12px;height:12px;border-radius:50%;display:block}
.tb-lights i:nth-child(1){background:#FF5F57}
.tb-lights i:nth-child(2){background:#FEBC2E}
.tb-lights i:nth-child(3){background:#28C840}
.tb-toggle{flex:0 0 var(--control-size);width:var(--control-size);height:var(--control-size);border:none;border-radius:8px;background:transparent;color:var(--ink2);display:grid;place-items:center;transition:background .15s,color .15s}
.tb-toggle:hover{background:var(--hover);color:var(--ink)}
.tb-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tb-toggle .fr-kbd{position:absolute;top:calc(var(--titlebar-h) - 4px);left:calc(var(--traffic-safe) + var(--control-size) / 2);transform:translateX(-50%);margin-top:4px;font-family:var(--mono);font-size:9.5px;color:var(--ink3);opacity:0;transition:opacity .15s;white-space:nowrap;pointer-events:none}
.tb-toggle:hover .fr-kbd{opacity:1}
.tb-context{display:flex;align-items:baseline;gap:8px;min-width:0;margin-left:2px;padding-left:10px;border-left:1px solid var(--line)}
/* 展开态：标题从侧栏右边界起；折叠态仍紧跟窗口开关。 */
body:not(.fr-collapsed) .tb-context{margin-left:calc(var(--rail-width) - 123px)}
.tb-title{font-size:14px;font-weight:700;line-height:1.2;letter-spacing:-0.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-meta{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:.4px;white-space:nowrap}
.tb-drag{flex:1;align-self:stretch;min-width:24px}
.tb-note{flex:0 0 auto;font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.4px;white-space:nowrap}
.m-brand{display:flex;align-items:center;gap:14px}
.m-brand-name{font-size:22px;font-weight:700;letter-spacing:-0.5px}
.m-brand-sub{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:1px;text-transform:uppercase}
/* 状态点：进行中 / 成功 / 失败，队列摘要用 */
.m-dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- logo mosaic ---------- */
.m-logo{display:grid;grid-template-columns:repeat(3,11px);grid-template-rows:repeat(3,11px);gap:2.5px}
.m-logo i{border-radius:3px;display:block}
.m-logo i.c{background:var(--ink)}

/* ---------- editor ---------- */
.m-editor{height:100%;display:flex;flex-direction:column}
.m-edbar{flex:0 0 60px;display:flex;align-items:center;gap:14px;padding:0 28px;background:var(--card)}
.m-backbtn{border:1px solid var(--ink3);background:var(--card);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:7px;transition:background .15s}
.m-backbtn:hover{background:var(--hover)}
.m-typechip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 14px;color:#fff;font-size:13px;font-weight:800}
/* 保存按钮自身表达状态：已保存 = 灰态不可点；未保存 = 主色；保存中 = 灰态文案 */
.m-savebtn{border:1px solid var(--ink3);background:var(--card);border-radius:999px;padding:8px 18px;font-size:14px;font-weight:700;color:var(--ink2);transition:background .15s,color .15s,border-color .15s}
.m-savebtn:disabled{cursor:default}
.m-savebtn.ready{background:var(--accent);border-color:var(--accent);color:#fff;cursor:pointer}
.m-savebtn.ready:hover{filter:brightness(1.06)}
.m-wordcount{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.m-pubbtn{margin-left:auto;border:none;background:var(--green);color:#fff;border-radius:999px;padding:11px 26px;font-size:15px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:9px;transition:transform .15s,filter .15s}
.m-pubbtn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.m-edbody{flex:1;min-height:0;display:grid;grid-template-columns:1fr 460px;gap:0}
/* 两栏各自滚动，容器负责裁切，并在底部托住一条「下面还有」的渐隐 */
.m-pane{position:relative;display:flex;min-height:0;overflow:hidden}
.m-writecol{flex:1;min-height:0;padding:0 40px 34px;overflow:auto;border-right:1px solid var(--line)}
/* 顶距放在首子元素上而不是容器 padding：工具栏 sticky 时才能贴到滚动区最顶 */
.m-writecol > :first-child{margin-top:34px}
.m-more{position:absolute;left:0;right:0;bottom:0;height:72px;pointer-events:none;z-index:4;transition:opacity .28s ease}
.m-pane:first-child .m-more{right:1px;background:linear-gradient(to bottom,rgba(255,255,255,0),var(--paper))}
[data-theme="dark"] .m-pane:first-child .m-more{background:linear-gradient(to bottom,rgba(25,25,25,0),var(--paper))}
.m-phone .m-more{height:56px;background:linear-gradient(to bottom,rgba(255,255,255,0),var(--card))}
[data-theme="dark"] .m-phone .m-more{background:linear-gradient(to bottom,rgba(37,37,37,0),var(--card))}
.m-more.off{opacity:0}
/* 标题：按 HIG 的层级做法 —— 字号、字重、颜色一起收。
   28px/700 与正文 17px 差两档，层级靠字号差不靠极端字重。 */
.m-titlein{width:100%;border:none;border-bottom:2px solid transparent;outline:none;font-size:var(--h1);font-weight:var(--h-weight);letter-spacing:var(--h-track);line-height:var(--h-leading);padding:4px 0 12px;background:transparent;color:var(--ink);transition:border-color .2s}
.m-titlein:focus{border-bottom-color:var(--accent)}
.m-titlein::placeholder{color:var(--ink3)}
/* 标题上方的编辑工具栏 */
/* 工具栏自成一格：吸附在写作列顶部（sticky），内容再长格式工具也不滚走 */
.m-toolbar{position:sticky;top:0;z-index:10;display:flex;width:100%;align-items:center;justify-content:space-between;gap:2px;padding:5px 8px;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 8px 12px -10px rgba(15,15,15,.16)}
.m-tbtn{width:36px;height:32px;border:none;border-radius:9px;background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:1px;cursor:pointer;transition:background .14s}
.m-tbtn:hover{background:var(--hover)}
.m-tbtn.on{background:var(--selected)}
.m-tbtn.hascaret{width:46px}
.m-tsep{flex:0 0 auto;width:1px;height:20px;border-radius:1px;background:var(--line)}
/* 标题 1 / 2 / 3 的选择菜单 */
.m-tmenu{position:absolute;top:calc(100% + 6px);left:0;z-index:20;min-width:132px;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;gap:2px;animation:m-pop .16s}
.m-tmenu-item{border:none;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;font-family:var(--font);font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer}
.m-tmenu-item:hover{background:var(--hover)}
.m-tmenu-item.on{background:var(--selected)}
/* 链接输入框：钉在工具栏下沿，输入 / 回车确认 / Esc 取消 */
.m-linkpop{position:absolute;top:calc(100% + 6px);right:0;z-index:21;display:flex;align-items:center;gap:6px;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow-pop);animation:m-pop .16s}
.m-linkpop-input{width:220px;border:none;outline:none;background:var(--hover);border-radius:8px;padding:6px 10px;font-family:var(--font);font-size:13px;color:var(--ink)}
.m-linkpop-input::placeholder{color:var(--ink3)}
.m-linkpop-btn{border:none;background:transparent;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:700;cursor:pointer;transition:background .15s,color .15s}
.m-linkpop-btn.ok{background:var(--accent);color:#fff}
.m-linkpop-btn.ok:hover{filter:brightness(1.06)}
.m-linkpop-btn.cancel{color:var(--ink2)}
.m-linkpop-btn.cancel:hover{background:var(--hover);color:var(--ink)}
/* 正文：一整块可编辑文档，图文同层 */
/* 占位文字浮在文字层之外：否则光标会被它挤到下一行，看着像错位 */
.m-richbody{position:relative;margin-top:22px;min-height:260px;outline:none;font-size:17px;line-height:1.85;color:var(--ink);word-break:break-word;overflow-wrap:break-word}
.m-richbody:empty:before,.m-richbody.is-empty:before{content:attr(data-placeholder);position:absolute;top:0;left:0;color:var(--ink3);pointer-events:none}
.m-richbody p,.m-richbody>div{margin:0 0 14px}
.m-richbody h1{font-size:24px;font-weight:700;letter-spacing:-0.3px;line-height:1.4;margin:24px 0 12px}
.m-richbody h2{font-size:20px;font-weight:700;letter-spacing:-0.2px;line-height:1.5;margin:22px 0 10px}
.m-richbody h3{font-size:17px;font-weight:700;line-height:1.55;margin:18px 0 8px}
.m-richbody blockquote{margin:0 0 14px;padding:2px 0 2px 14px;border-left:3px solid var(--ink);color:var(--ink2)}
.m-richbody ul,.m-richbody ol{margin:0 0 14px;padding-left:24px}
.m-richbody li{margin-bottom:4px}
.m-richbody hr{border:none;border-top:2px solid var(--ink);margin:20px 0}
.m-richbody a{color:var(--blue);text-decoration:underline;text-underline-offset:3px}
.m-tag{border-radius:4px}
/* ==高亮==：荧光笔效果，随主题换底色 */
.m-mark{background:#FFE9A6;color:inherit;border-radius:3px;padding:0 2px}
[data-theme="dark"] .m-mark{background:#4A4023;color:#F3E5B8}
/* 正文里的配图：写的时候就是一张图，不是一个 markdown 记号 */
.m-fig{display:block;position:relative;width:min(100%,340px);aspect-ratio:16/9;border-radius:12px;margin:4px 0 16px;background:var(--hover)}
.m-fig-del{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:8px;border:2px solid #fff;background:rgba(15,15,15,.35);color:#fff;font-size:13px;line-height:1;cursor:pointer;opacity:0;transition:opacity .15s,background .15s}
.m-fig:hover .m-fig-del{opacity:1}
.m-fig-del:hover{background:var(--ink)}
/* 素材区：统一置顶、只占一条 —— 编辑页的主角是正文 */
.m-assetsec{margin:0 0 26px}
.m-assethead{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.m-assethead .sq{width:13px;height:13px;border-radius:4px}
.m-assethead .t{font-size:13px;font-weight:700}
.m-assethead .n{font-family:var(--mono);font-size:11px;color:var(--ink2)}
/* 清空：钉在素材头部最右，次要动作的克制样式 */
.m-assetclear{margin-left:auto;border:none;background:transparent;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--ink2);transition:background .15s,color .15s}
.m-assetclear:hover{background:var(--hover);color:var(--ink)}
.m-assetclear:disabled{opacity:.4;cursor:default}
/* 缩略图一行排开：放不下时给一个收起/展开 icon，默认收起 */
.m-imgwrap{display:flex;align-items:center;gap:10px}
.m-imgrow{display:flex;flex:1;min-width:0;flex-wrap:nowrap;gap:8px;overflow:hidden}
.m-imgrow.open{flex-wrap:wrap;overflow:visible}
/* 收起态的右缘渐隐：放不下的格子淡出去，而不是被切成半个 */
.m-imgrow:not(.open){-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent)}
/* 拖动中放开裁切：拎起来的缩略图要能跟着指针走出那一行 */
.m-imgrow.reordering{overflow:visible;-webkit-mask-image:none;mask-image:none}
.m-imgcell{position:relative;flex:0 0 auto;width:72px;height:72px;border-radius:10px;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;gap:3px;padding:6px;cursor:grab;transition:box-shadow .18s,opacity .18s}
.m-imgcell.dragging{cursor:grabbing;z-index:12;transition:none;transform-origin:50% 50%;box-shadow:var(--shadow-pop)}
.m-imgcell.over{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--accent)}
.m-imgcell.add{background:var(--card);border:1.5px dashed var(--ink3);color:var(--ink2);align-items:center;justify-content:center;cursor:pointer}
.m-imgcell.add:hover{border-color:var(--ink);color:var(--ink);transform:none}
/* 缩略图右上角的删除：悬停出现；长按拖拽钩子会跳过 .w-tileacts */
.m-imgcell .w-tileacts{right:4px;top:4px}
.m-imgcell:hover .w-tileacts,.m-imgcell .w-tileacts:focus-within{opacity:1}
.m-imgtoggle{flex:0 0 auto;width:28px;height:28px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.m-imgtoggle:hover{background:var(--hover)}
/* 视频 / 音频素材盒：与封面同一条内容宽度，悬停出删除；删除后回到一个可再上传的空槽 */
.m-mediabox{position:relative;width:100%;max-width:560px}
.m-mediabox .w-tileacts{right:9px;top:9px}
.m-mediabox:hover .w-tileacts,.m-mediabox .w-tileacts:focus-within{opacity:1}
.m-audiowrap{display:flex;align-items:center;gap:10px;width:100%;max-width:560px}
.m-audiowrap .m-audiobar{flex:1 1 auto}
.m-audiowrap .w-tileacts{position:static;opacity:1}
.m-uploadslot{border:1.5px dashed var(--ink3);border-radius:12px;background:var(--card);color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13.5px;font-weight:700;transition:border-color .15s,color .15s}
/* 视频封面占 16:9；音频传完只是一条播放条，上传槽也保持同高 */
.m-uploadslot.box{width:100%;max-width:560px;aspect-ratio:16/9}
.m-uploadslot.slim{width:100%;max-width:560px;flex-direction:row;justify-content:flex-start;gap:10px;padding:14px 16px}
.m-uploadslot:hover{border-color:var(--ink);color:var(--ink)}
/* 视频封面：铺满写作列（上限 560px），封面是素材区的主角 */
.m-cover{width:100%;max-width:560px;aspect-ratio:16/9;border-radius:12px;background:var(--ink);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.m-playbig{width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;border:none;transition:transform .15s}
.m-playbig:hover{transform:scale(1.08)}
/* 音频播放条：与封面同一条内容宽度，媒体件保持深炭底，不随主题翻转（与实现一致） */
.m-audiobar{background:#4A4740;border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:12px;width:100%;max-width:560px}
.m-audioplay{width:34px;height:34px;border-radius:50%;background:var(--cyan);border:none;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#17323A;transition:transform .15s}
.m-audioplay:hover{transform:scale(1.08)}
.m-audiotrack{flex:1}
.m-audiotime{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.6);display:flex;justify-content:space-between;margin-bottom:6px}
.m-audioline{height:5px;border-radius:3px;background:rgba(255,255,255,.2);position:relative;overflow:hidden}
.m-audioline i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;display:block}

/* ---------- preview column ---------- */
.m-prevcol{flex:1;min-height:0;background:var(--hover);padding:22px 28px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
/* 手机屏高度固定：只有正文在屏内滚，标题 / 素材 / 页脚都留在屏上 */
.m-phone{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-pop);max-width:380px;max-height:640px;width:100%;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.m-phone-head{display:flex;align-items:center;gap:9px;flex:0 0 auto;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.m-phone-title{flex:0 0 auto;font-size:19px;font-weight:var(--h-weight);line-height:1.4;letter-spacing:-0.2px;margin:16px 20px 0}
.m-phone-body{position:relative;flex:1;min-height:0;display:flex}
.m-phone-scroll{flex:1;min-height:0;overflow:auto;padding:10px 20px 8px}
.m-phone-media{flex:0 0 auto;padding:4px 20px 0}
.m-phone-head .av{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
.m-phone-head .who{font-size:13px;font-weight:var(--h-weight)}
.m-phone-head .when{font-family:var(--mono);font-size:10px;color:var(--ink2)}
.m-phone .body{font-size:14px;line-height:1.85;color:var(--ink)}
/* 预览正文：与编辑器同一份富文本，只换字号与间距 */
.m-phone .m-richbody-phone p{margin:0 0 10px}
.m-phone .m-richbody-phone h1{font-size:18px;font-weight:700;line-height:1.45;margin:16px 0 8px}
.m-phone .m-richbody-phone h2{font-size:16px;font-weight:700;line-height:1.5;margin:14px 0 8px}
.m-phone .m-richbody-phone h3{font-size:15px;font-weight:700;line-height:1.55;margin:12px 0 6px}
.m-phone .m-richbody-phone blockquote{margin:0 0 10px;padding-left:10px;border-left:2.5px solid var(--line);color:var(--ink2)}
.m-phone .m-richbody-phone ul,.m-phone .m-richbody-phone ol{margin:0 0 10px;padding-left:20px}
.m-phone .m-richbody-phone hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.m-phone .m-richbody-phone a{color:var(--accent)}
.m-phone .m-richbody-phone .m-fig{width:100%;max-width:none;margin:2px 0 10px;border-radius:10px;background:var(--selected)}
.m-phone .m-fig-del{display:none}
/* 贴图预览：缩略图定宽不缩水，手机式拖动横滑（无滚动条） */
.m-phone .pimgs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.m-phone .pimgs:active{cursor:grabbing}
.m-phone .pimgs i{flex:0 0 auto;width:72px;height:72px;border-radius:8px;display:block}
.m-phone .pcover{aspect-ratio:16/9;border-radius:12px;background:var(--ink);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.m-phone .pcover .tri{width:0;height:0;border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
/* 播放中的暂停图标：一根白条 + box-shadow 复制出第二根 */
.m-phone .pcover .ppause{width:10px;height:14px;position:relative}
.m-phone .pcover .ppause::before{content:"";position:absolute;left:0;top:0;width:3px;height:14px;border-radius:1.5px;background:#fff;box-shadow:7px 0 0 #fff}
.m-phone .pcover .d{position:absolute;bottom:12px;right:10px;color:#fff;font-family:var(--mono);font-size:10px}
/* 只读但可播：底部一条进度随假播放推进 */
.m-phone .pcover .track{position:absolute;left:10px;right:10px;bottom:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.28)}
.m-phone .pcover .track i{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:2px;display:block}
.m-phone .paudio{background:var(--selected);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px}
.m-phone .paudio .btn{width:30px;height:30px;border-radius:50%;background:var(--ink);flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;border:none;padding:0}
/* 播放 / 暂停两枚图形都是真实元素，由 React 切换，不依赖伪元素 */
.m-phone .paudio .ptri{width:0;height:0;border-left:10px solid var(--card);border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:2px}
.m-phone .paudio .pp{width:9px;height:12px;position:relative}
.m-phone .paudio .pp::before{content:"";position:absolute;left:0;top:0;width:3px;height:12px;border-radius:1.5px;background:var(--card);box-shadow:6px 0 0 var(--card)}
.m-phone .paudio .ln{flex:1;height:5px;border-radius:3px;background:var(--line);position:relative;cursor:pointer}
.m-phone .paudio .ln i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);border-radius:3px;display:block}
.m-phone .paudio .tm{font-family:var(--mono);font-size:10px;color:var(--ink2);white-space:nowrap}

/* ---------- publish sheet ---------- */
.m-overlay{position:fixed;inset:0;background:var(--backdrop);display:flex;align-items:center;justify-content:center;z-index:60;animation:m-fade .18s}
.m-sheet{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);width:760px;max-width:92vw;padding:30px 34px 28px;animation:m-pop .22s cubic-bezier(.2,.8,.3,1.2)}
.m-sheet-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.m-sheet-head h2{font-size:var(--h2);font-weight:var(--h-weight);letter-spacing:-0.2px;line-height:var(--h-leading)}
.m-sheet-head .sel{font-family:var(--mono);font-size:13px;color:var(--ink2);margin-left:auto}
.m-typechip-sm{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 12px;color:#fff;font-size:12px;font-weight:800}
.m-sheet-sub{font-size:14px;color:var(--ink2);margin-bottom:22px}
/* 平台墙：一个方块就是一个平台 icon，只带状态，不带名称 */
.m-platwall{display:flex;flex-wrap:wrap;gap:16px;padding:14px 6px 8px}
.m-platico{position:relative;width:56px;height:56px;border-radius:16px;border:none;display:flex;align-items:center;justify-content:center;font-family:var(--font);font-size:19px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-card);transition:transform .16s cubic-bezier(.2,.7,.3,1),box-shadow .16s,opacity .16s}
.m-platico:hover{transform:translateY(-3px)}
.m-platico.sm{width:38px;height:38px;border-radius:12px;font-size:14px}
.m-platico.sm .m-platck{width:16px;height:16px;border-radius:5px;top:-5px;right:-5px}
.m-platico.sm .m-platretry{width:16px;height:16px;bottom:-5px;right:-5px;border-width:1px}
.m-platico.fail,.m-platico.muted{background:var(--hover) !important;color:var(--ink3) !important;box-shadow:none}
.m-platico.fail:hover,.m-platico.muted:hover{transform:none}
.m-platretry{position:absolute;bottom:-7px;right:-7px;width:21px;height:21px;border-radius:7px;background:var(--card);border:1px solid var(--line);color:var(--ink2);display:flex;align-items:center;justify-content:center}
.m-platck{position:absolute;top:-7px;right:-7px;width:21px;height:21px;border-radius:7px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;animation:m-pop .25s}
/* 约束预检：这篇稿子在该平台会超限，选前就说清 */
/* 放左上角：右上角留给「已选」的对勾，两个标记不会打架 */
.m-platdot{position:absolute;top:-3px;left:-3px;width:13px;height:13px;border-radius:50%;background:var(--error);border:2.5px solid var(--paper)}
/* 默认发布平台：每种稿子一条单独的横带。
   每条带子自己有上下留白 + 一条细线，四类之间彻底分开 */
.m-typerows{display:flex;flex-direction:column;gap:0}
.m-typerow{display:flex;align-items:center;gap:16px;padding:18px 0;border-top:1px solid var(--line)}
.m-typerow:first-child{padding-top:4px;border-top:none}
.m-typerow:last-child{padding-bottom:4px}
.m-trowlabel{display:inline-flex;align-items:center;gap:8px;width:74px;flex:0 0 auto;font-size:14px;font-weight:700}
.m-trowlabel .sq{width:13px;height:13px;border-radius:4px}
.m-trowicons{display:flex;flex-wrap:wrap;gap:10px}
.m-sheet-foot{display:flex;align-items:center;gap:14px;margin-top:30px}
.m-donebtn{margin-left:auto;border:none;background:var(--accent);color:#fff;border-radius:999px;padding:11px 26px;font-size:15px;font-weight:700;transition:filter .15s}
.m-donebtn:hover{filter:brightness(1.06)}
.m-ghostbtn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:12px 24px;font-size:15px;font-weight:700;color:var(--ink);margin-left:auto;transition:background .15s}
.m-ghostbtn:hover{background:var(--hover)}
.m-confirmbtn{border:none;background:var(--green);color:#fff;border-radius:999px;padding:13px 30px;font-size:16px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:9px;transition:transform .15s,filter .15s}
.m-confirmbtn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.m-confirmbtn:disabled{opacity:.35;cursor:not-allowed;transform:none}

/* ---------- tasks：单栏队列 ---------- */
.m-tasks{padding:0}
.m-tsummary{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink2);margin-bottom:18px}
.m-tsummary b{color:var(--ink);font-size:15px;margin-left:5px}
.m-tlist{display:flex;flex-direction:column;gap:10px}
/* 一篇稿子一行：稿子在左，这一轮发到的平台在右，状态就长在方块上 */
.q-item{padding:11px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-card);transition:transform .18s cubic-bezier(.2,.7,.3,1)}
.q-item:hover{transform:translateY(-2px)}
.q-head{display:flex;align-items:center;gap:14px;min-height:46px}
.q-sq{flex:0 0 14px;width:14px;height:14px;border-radius:4px;display:block}
.q-title{flex:0 1 auto;min-width:0;max-width:38%;border:none;background:transparent;padding:0;text-align:left;font-size:15px;font-weight:var(--h-weight);letter-spacing:-0.2px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-title:hover{text-decoration:underline}
.q-title:disabled{cursor:default;color:var(--ink2)}
.q-icons{flex:0 0 auto;display:flex;align-items:center;gap:14px;margin-left:6px}
.q-meta{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11px;color:var(--ink2)}

/* 平台方块：一枚方块顶原来一整行 */
.q-tile{position:relative;flex:0 0 auto;width:46px;height:46px;border:1px solid transparent;border-radius:14px;padding:0;font-family:inherit;font-size:16px;font-weight:700;line-height:1;text-decoration:none;display:block;box-shadow:var(--shadow-card);transition:transform .16s cubic-bezier(.2,.7,.3,1)}
.q-tile:hover{transform:translateY(-3px)}
/* 内层负责裁剪，角标挂在外层，才不会被裁掉 */
.q-body{position:absolute;inset:0;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.q-body .ch{position:relative;z-index:2}
.q-tile .badge{position:absolute;z-index:3;display:flex;align-items:center;justify-content:center;border:2px solid #fff;border-radius:7px;font-family:var(--mono);font-weight:800}
.q-tile .badge.ok,.q-tile .badge.bad{right:-6px;top:-6px;width:19px;height:19px;color:#fff}
.q-tile .badge.ok{background:var(--green)}
.q-tile .badge.bad{background:var(--error)}
.q-tile .badge.pct{right:-7px;bottom:-7px;min-width:20px;height:17px;padding:0 5px;background:var(--accent);color:#fff;font-size:9.5px;border-radius:6px}

/* 进行中：水位从底部涨上来，字随水位从下往上漂白 */
.q-tile.running{background:var(--hover);color:var(--pc);cursor:default}
.q-tile.running:hover{transform:none}
.q-tile.running .fill{position:absolute;left:0;right:0;bottom:0;background:var(--pc);z-index:1;transition:height .55s cubic-bezier(.2,.7,.3,1)}
/* 两层同宽椭圆叠出水面：一层定形，一层缓慢平移做波纹 */
.q-tile.running .fill::before,.q-tile.running .fill::after{content:"";position:absolute;left:-60%;width:220%;height:12px;border-radius:50%;background:var(--pc)}
.q-tile.running .fill::before{top:-6px;opacity:.95}
.q-tile.running .fill::after{top:-3px;opacity:.55;animation:q-wave 3.6s ease-in-out infinite}
.q-tile.running .fill .chfill{position:absolute;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;justify-content:center;color:var(--fg);z-index:1;font-weight:700}

/* 已发布：整块就是链接 */
.q-tile.ok{background:var(--pc);color:var(--fg)}
/* 出问题：整块换成错误色，点一下重试 */
.q-tile.bad{background:var(--error);color:#fff;cursor:pointer}
/* 错误条按内容收紧，别拉成一条横贯整行的空带子 */
.q-err{display:flex;align-items:center;gap:9px;width:fit-content;max-width:100%;margin-top:9px;padding:8px 12px;background:var(--error-soft);border:1px solid var(--error-line);border-radius:11px;color:var(--error)}
.q-errtxt{min-width:0;font-size:12.5px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-errtxt b{font-weight:700}
.q-retry{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--error);background:var(--card);border-radius:999px;padding:3px 11px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--error);transition:background .15s,color .15s}
.q-retry:hover{background:var(--error);color:#fff}
/* 失败：信息收进悬浮 tooltip，重试是悬浮时浮现的 icon 按钮 */
.q-tilewrap{position:relative;flex:0 0 auto;display:block}
.q-tile-retry{position:absolute;inset:0;z-index:2;display:grid;place-items:center;border:none;border-radius:14px;background:rgba(200,30,78,.92);color:#fff;cursor:pointer;opacity:0;transition:opacity .15s}
.q-tilewrap:hover .q-tile-retry,.q-tilewrap:focus-within .q-tile-retry{opacity:1}
.q-tip{position:fixed;z-index:1000;display:flex;width:max-content;max-width:300px;flex-direction:column;gap:3px;padding:9px 12px;background:var(--ink);color:var(--paper);border-radius:10px;font-size:12px;line-height:1.55;text-align:left;box-shadow:var(--shadow-pop)}
.q-tiptxt b{font-weight:700}
.q-tipmeta{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:10.5px;opacity:.78}
.q-tipx{border:none;background:transparent;padding:0;font-family:var(--mono);font-size:10.5px;font-weight:700;color:inherit;text-decoration:underline;cursor:pointer;opacity:.85}
.q-tipx:hover{opacity:1}
/* 删除整条队列记录：行尾一枚 ×，默认隐形、悬停行时浮现 */
.q-del{flex:0 0 auto;display:grid;place-items:center;width:22px;height:22px;border:none;border-radius:7px;background:transparent;color:var(--ink3);opacity:0;transition:background .15s,color .15s,opacity .15s;cursor:pointer}
.q-item:hover .q-del{opacity:1}
.q-del:hover{background:var(--error-soft);color:var(--error)}
.q-del:disabled{cursor:default;opacity:.25}
.q-del:disabled:hover{background:transparent;color:var(--ink3)}
/* 不可重试的失败：一枚说明性标签替代重试按钮（重试点一万次也不会成功） */
.q-errtag{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--error);background:var(--card);border:1px dashed var(--error-line);border-radius:999px;padding:3px 10px;white-space:nowrap}
/* 失败发生时间 + 移除记录 */
.q-errmeta{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;color:var(--error);opacity:.72}
.q-dismiss{flex:0 0 auto;display:grid;place-items:center;width:22px;height:22px;border:none;border-radius:7px;background:transparent;color:var(--error);opacity:.6;transition:background .15s,opacity .15s}
.q-dismiss:hover{background:var(--error);color:#fff;opacity:1}
.q-tile.bad{cursor:default}
.q-tile.bad:hover{transform:none}
@keyframes q-wave{0%,100%{transform:translateX(-3%)}50%{transform:translateX(3%)}}
.m-emptybox{border:1px dashed var(--ink3);border-radius:var(--r-md);padding:22px;text-align:center;color:var(--ink2);font-size:13px;font-family:var(--mono)}

/* ---------- floating pill ---------- */
/* 浮动发布状态：跟随主题反色（浅色页 = 深底白字，深色页 = 浅底深字），两种模式都可读；钉在顶部 */
.m-pill{position:fixed;left:50%;top:26px;transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--paper);border-radius:999px;padding:13px 22px;display:flex;align-items:center;gap:14px;font-size:14px;font-weight:700;border:none;box-shadow:0 10px 30px rgba(15,15,15,.28);animation:m-rise .3s cubic-bezier(.2,.8,.3,1.2)}

/* ---------- 未保存离开确认 ---------- */
.m-mini{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-pop);width:440px;max-width:90vw;padding:24px 26px;animation:m-pop .18s cubic-bezier(.2,.8,.3,1.2)}
.m-mini h3{font-size:17px;font-weight:var(--h-weight);letter-spacing:-0.2px}
.m-mini p{margin-top:8px;font-size:13.5px;line-height:1.7;color:var(--ink2)}
.m-mini-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:22px}
.m-btn-plain{border:none;background:transparent;border-radius:999px;padding:9px 14px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.m-btn-plain:hover{background:var(--hover);color:var(--ink)}
.m-btn-danger{border:none;background:transparent;border-radius:999px;padding:9px 14px;font-size:13.5px;font-weight:700;color:var(--error)}
.m-btn-danger:hover{background:var(--error-soft)}
.m-btn-primary{border:none;background:var(--accent);color:#fff;border-radius:999px;padding:10px 20px;font-size:13.5px;font-weight:700;transition:filter .15s}
.m-btn-primary:hover{filter:brightness(1.06)}
.m-btn-error{border:none;background:var(--error);color:#fff;border-radius:999px;padding:10px 20px;font-size:13.5px;font-weight:700;transition:filter .15s}
.m-btn-error:hover{filter:brightness(1.06)}
/* 导入登录态确认的主按钮：动作有打断（关一次工作台浏览器）但不毁数据，走主色不走错误红 */
.m-btn-acc{border:none;background:var(--accent);color:#fff;border-radius:999px;padding:10px 20px;font-size:13.5px;font-weight:700;transition:filter .15s}
.m-btn-acc:hover{filter:brightness(1.06)}
.m-pill .sqs{display:flex;gap:4px}
.m-pill .sqs i{width:10px;height:10px;border-radius:3px;display:block;animation:m-pulse 1.1s infinite}
.m-pill .sqs i:nth-child(2){animation-delay:.18s}
.m-pill .sqs i:nth-child(3){animation-delay:.36s}
.m-pill .mono{font-family:var(--mono);font-size:12px;color:#9AF0C9}
/* 深色主题下浮条是浅底，薄荷绿换成产品绿才看得清 */
[data-theme="dark"] .m-pill .mono{color:var(--green)}

@keyframes m-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes m-fade{from{opacity:0}to{opacity:1}}
@keyframes m-pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes m-rise{from{opacity:0;transform:translateX(-50%) translateY(-24px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

/* ==================================================================
   工作台骨架 —— 左栏定类型，主区是统一的卡片网格。
   四种类型共用一个卡片壳，封面各自长脸；类型色只出现在小面积。
   ================================================================== */
.w-shell{flex:1;min-height:0;display:flex;overflow:hidden;background:var(--paper)}

/* ---------- 左侧栏 ---------- */
.w-rail{flex:0 0 236px;min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px;padding:18px 14px 14px;background:var(--rail);border-right:1px solid var(--line)}
.w-rail .m-brand{gap:11px;padding:0 8px}
.w-rail .m-brand-name{font-size:16px;letter-spacing:-0.3px}
.w-rail .m-brand-sub{font-size:9.5px;letter-spacing:0.8px}
/* 新建内容：主按钮用交互蓝 */
.w-newall{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;padding:10px 0;font-size:15px;font-weight:700;color:#fff;background:var(--accent);transition:filter .15s,transform .15s}
.w-newall:hover{filter:brightness(1.06)}
.w-newall:active{transform:translateY(1px)}
.w-nav{display:flex;flex-direction:column;gap:3px}
/* width:100% 是必要的：按钮在块级容器里会按内容收缩，设置那一行因此只剩半行可点 */
.w-navitem{width:100%;display:grid;grid-template-columns:14px minmax(0,1fr) auto;align-items:center;gap:10px;border:none;background:transparent;border-radius:10px;padding:8px 10px;font-size:15px;font-weight:700;color:var(--ink);text-align:left;transition:background .15s}
.w-navitem:hover{background:var(--hover)}
.w-navitem.on{background:var(--selected)}
.w-navitem:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.w-sq{width:14px;height:14px;border-radius:4px;display:block}
.w-navn{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink2)}
.w-navitem.on .w-navn{color:var(--ink2)}
.w-navitem .w-badge{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--green);color:#fff;border-radius:999px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
/* 四类之下才是次要入口：一条分隔线，字号收一档 */
.w-navsub{margin-top:2px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.w-navsub .w-navitem{font-size:14px;padding:7px 10px}
/* 栏底：设置一个人占一行。凭据都拿到时它不带任何标记 */
.w-railtail{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.w-attn{font-family:var(--mono);font-size:10.5px;font-weight:700;color:#fff;background:var(--error);border-radius:999px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}

/* ---------- 主区 ---------- */
.w-stage{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.w-view{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
/* 头部与网格共用同一条内容列：两边同时收窄、同时居中，右上角的工具才不会飘在网格之外 */
.w-canvas{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:1560px;margin:0 auto}
.w-head{flex:0 0 auto;display:flex;align-items:flex-end;gap:16px;padding:26px 34px 16px;flex-wrap:wrap}
.w-head.tools-only{justify-content:flex-end;padding:12px 34px 12px}
.w-headline{display:flex;align-items:baseline;gap:12px;min-width:0}
.w-h1{font-size:var(--h1);font-weight:var(--h-weight);letter-spacing:var(--h-track);line-height:var(--h-leading)}
.w-hmeta{font-family:var(--mono);font-size:11.5px;color:var(--ink2);letter-spacing:.5px;white-space:nowrap}
.w-tools{margin-left:auto;display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:10px;row-gap:8px;max-width:100%;min-width:0}
.w-search{display:flex;align-items:center;gap:8px;flex:0 1 210px;width:210px;min-width:120px;max-width:100%;padding:8px 14px;background:var(--card);border:1px solid var(--line);border-radius:999px;color:var(--ink2);transition:width .22s cubic-bezier(.2,.7,.3,1),border-color .15s}
.w-search:focus-within{width:290px;border-color:var(--accent);color:var(--ink)}
.w-search input{width:100%;border:none;outline:none;background:transparent;font-size:14px;color:var(--ink)}
.w-search input::placeholder{color:var(--ink3)}
.w-srchclear{flex:0 0 auto;width:18px;height:18px;border:none;border-radius:6px;background:var(--hover);color:var(--ink2);display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.w-srchclear:hover{background:var(--ink);color:var(--paper)}
.w-sort{position:relative}
.w-ghostbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;transition:background .15s}
.w-ghostbtn:hover{background:var(--hover)}
.w-new{display:flex;align-items:center;gap:8px;border:none;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:900;color:#fff;white-space:nowrap;transition:transform .15s,filter .15s}
.w-new:hover{transform:translateY(-2px);filter:brightness(1.06)}
/* 下拉菜单：排序 */
.w-menu{position:absolute;top:calc(100% + 8px);right:0;z-index:30;min-width:160px;display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-pop);animation:m-pop .16s}
.w-menu.left{left:0;right:auto}
.w-menuitem{display:flex;align-items:center;gap:9px;border:none;background:transparent;border-radius:9px;padding:8px 10px;font-size:13.5px;font-weight:700;color:var(--ink);text-align:left;transition:background .12s}
.w-menuitem:hover{background:var(--hover)}
.w-menuitem.on{background:var(--selected)}
.w-backdrop{position:fixed;inset:0;z-index:25;border:none;background:transparent}

/* ---------- 卡片网格：四种类型全部以卡片呈现 ---------- */
.w-scroll{flex:1;min-height:0;overflow:auto;padding:0 34px 120px}
.w-queuescroll{padding-top:12px}
.w-grid{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px}
.w-tile{display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);cursor:pointer;transition:transform .2s cubic-bezier(.2,.7,.3,1),box-shadow .2s}
.w-tile:hover{transform:translateY(-4px);box-shadow:var(--shadow-tile)}
.w-tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 长按拖动：按下先收一下，拎起来之后脱离网格、跟着指针走 */
.w-tile.pressing{transform:scale(.975)}
.w-tile.dragging{cursor:grabbing;z-index:12;transition:none;transform-origin:50% 50%;box-shadow:var(--shadow-pop)}
.w-tile.dragging .w-tileacts{opacity:0}
.w-grid.reordering{cursor:grabbing}
body.w-dragging,body.w-dragging *{user-select:none;cursor:grabbing}
.w-tilemain{display:flex;flex-direction:column;gap:4px;min-width:0}
.w-tiletitle{font-size:15px;font-weight:var(--h-weight);letter-spacing:-0.2px;line-height:1.35;min-height:2.7em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.w-tilemeta{height:16px;font-family:var(--mono);font-size:10.5px;line-height:16px;color:var(--ink2);display:flex;gap:9px;align-items:center;white-space:nowrap;overflow:hidden}
.w-coverwrap{position:relative}
/* 封面壳：文章 / 音频 16:10，视频 16:9 —— 封面里是摘要文字或播放入口 */
.w-cover{position:relative;display:block;width:100%;aspect-ratio:16/10;border-radius:10px;background:var(--hover);overflow:hidden}
.w-cover.v{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
/* 文章 / 音频封面：三行摘要直接当封面 */
.w-covertext{position:absolute;inset:0;padding:13px 14px 18px;font-size:12.5px;line-height:1.62;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-align:left}
.w-covertext.empty{color:var(--ink3)}
.w-covertext.audio{padding-bottom:38px}
/* 音频封面角标：青色小三角 + 时长 */
.w-audiotri{position:absolute;left:9px;bottom:9px;width:0;height:0;border-left:11px solid var(--cyan);border-top:7px solid transparent;border-bottom:7px solid transparent;opacity:.95}
.w-coverdur{position:absolute;right:8px;bottom:7px;font-family:var(--mono);font-size:10px;color:var(--ink2)}
/* 视频封面：墨色播放三角 + 时长 */
.w-vtri{width:0;height:0;margin-left:4px;border-left:14px solid var(--ink);border-top:9px solid transparent;border-bottom:9px solid transparent;opacity:.92}
/* 「发布中」：accent 色小药丸，钉在封面左下角 */
.w-livepill{position:absolute;left:7px;bottom:6px;z-index:1;display:inline-flex;align-items:center;gap:5px;background:var(--accent);color:#fff;border-radius:999px;padding:2.5px 8px;font-family:var(--mono);font-size:10px;font-weight:700}
.w-livepill i{width:6px;height:6px;border-radius:2px;background:#fff;display:block;animation:m-pulse 1.1s infinite}
/* 「已发布」：标题行的小徽标，提示这篇发出去过，防止重复发布 */
.w-pubbadge{display:inline-flex;align-items:center;gap:4px;height:16px;padding:0 8px;border-radius:999px;background:rgba(7,181,111,.1);color:var(--green);font-family:var(--mono);font-size:10px;font-weight:700;line-height:1}
/* 贴图封面 = Logo 的九宫格语言放大：满格拼贴，张数写在角上 */
.w-mosaic{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--selected)}
.w-mosaic i{display:block}
.w-empty{padding:44px;border:1px dashed var(--ink3);border-radius:var(--r-md);text-align:center;font-family:var(--mono);font-size:13px;color:var(--ink2)}
/* 格子里没有 hover 出来的空间，动作常态悬浮在封面右上角 */
.w-coverwrap{position:relative}
.w-tileacts{position:absolute;right:7px;top:7px;z-index:2;display:flex;gap:5px;opacity:0;transition:opacity .15s}
.w-tile:hover .w-tileacts,.w-tile:focus-within .w-tileacts{opacity:1}
.w-tileacts .w-icon{width:27px;height:27px;border-radius:9px;opacity:1;background:rgba(255,255,255,.94);border:1px solid var(--line);color:var(--ink2);box-shadow:0 1px 4px rgba(15,15,15,.12)}
.w-tileacts .w-icon:hover{background:var(--hover);color:var(--ink)}
[data-theme="dark"] .w-tileacts .w-icon{background:rgba(37,37,37,.94)}
.w-icon{width:30px;height:30px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink2);display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.w-icon:hover{background:var(--hover);color:var(--ink)}

/* ---------- 设置：外观 + 平台账号 + 默认发布名单 ---------- */
.w-set{width:780px;max-height:calc(100vh - 72px);display:flex;flex-direction:column;position:relative}
.w-setscroll{flex:1;min-height:0;overflow:auto;padding-right:6px;padding-bottom:64px;margin-top:8px}
/* 完成浮在滚动区上：通道全透明，滚过的内容不被一块底色挡住 */
.w-set .m-sheet-foot{position:absolute;left:0;right:0;bottom:0;margin:0;padding:0 34px 22px;pointer-events:none}
.w-set .m-sheet-foot .m-donebtn{pointer-events:auto}
/* 上下留够气口：账号行之间、段落之间、列表行之间都拉开 */
.w-setsec + .w-setsec{margin-top:30px;padding-top:26px;border-top:1px solid var(--line)}
.w-setsec h4{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:var(--h-weight);letter-spacing:-0.2px;margin-bottom:14px}
.w-setn{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink2)}
/* 外观：三段选择器（浅色 / 深色 / 跟随系统） */
.w-theme{display:inline-flex;align-items:center;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.w-theme button{border:none;background:transparent;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--ink2);transition:background .15s,color .15s}
.w-theme button:hover{background:var(--hover)}
.w-theme button.on{background:var(--accent);color:#fff}
/* 外观行：标题与切换器同一行，左标题右控件 */
.w-sethead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:0}
.w-sethead h4{margin-bottom:0}
.w-accts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.w-acct{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-card);transition:border-color .15s}
.w-acct:hover{border-color:var(--ink3)}
.w-acct.active{border-color:var(--accent)}
.w-acct .w-sq{flex:0 0 14px;width:14px;height:14px;border-radius:4px;display:block}
.w-acctname{flex:0 0 72px;font-size:13.5px;font-weight:700;letter-spacing:-0.1px;text-align:left}
.w-acctwho{flex:1;min-width:0;font-size:11.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-acctchev{flex:0 0 auto;display:flex;color:var(--ink2)}

/* 浏览器选择：一枚 select 挂标题右侧（与主题切换器同构），浏览器越支持越多也不占地方；
   切换只落偏好不动数据，再次获取账号才以新浏览器整体覆盖 —— 覆盖语义写在辅助句与确认弹窗里 */
.w-selwrap{position:relative;display:inline-flex;align-items:center}
.w-selwrap .bico{position:absolute;left:12px;display:flex;pointer-events:none}
.w-selwrap select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 30px 6px 33px;font-size:12px;font-weight:700;font-family:var(--font);cursor:pointer;transition:border-color .15s}
.w-selwrap select:hover{border-color:var(--ink3)}
.w-selwrap select:focus-visible{outline:none;border-color:var(--accent)}
.w-selwrap select:disabled{opacity:.55;cursor:default}
.w-selwrap .cv{position:absolute;right:12px;pointer-events:none;display:flex;color:var(--ink2)}

/* 导入登录态：独立按钮与浏览器选择同一行 —— 覆盖的是全平台共用的 Cookies 库，
   所以入口只有一个、不挂在任何单个平台上；导入后自动重校验全部账号 */
.w-settools{display:inline-flex;align-items:center;gap:8px}
.w-importbtn{display:inline-flex;align-items:center;gap:6px;border:none;background:var(--accent);color:#fff;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;transition:filter .15s}
.w-importbtn:hover{filter:brightness(1.06)}
.w-importbtn:disabled{opacity:.55;cursor:default;filter:none}
.w-imphint{margin:10px 0 0;font-size:11.5px;line-height:1.7;color:var(--ink2)}

/* 凭据卡：浮在设置弹窗外侧，左列账号往左、右列往右，不挤压下面的名单 */
.w-acctpop{position:fixed;z-index:70;padding:16px 18px 18px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-pop);animation:m-pop .18s cubic-bezier(.2,.8,.3,1.2)}
.w-acctpop::after{content:"";position:absolute;top:26px;width:12px;height:12px;background:var(--card);border:1px solid var(--line);transform:rotate(45deg)}
.w-acctpop.left::after{right:-8px;border-left:none;border-bottom:none}
.w-acctpop.right::after{left:-8px;border-right:none;border-top:none}
.w-acctpop-head{display:flex;align-items:center;gap:9px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.w-acctpop-head .w-sq{flex:0 0 14px;width:14px;height:14px;border-radius:4px;display:block}
.w-acctpop-head .t{flex:1;min-width:0;font-size:14px;font-weight:var(--h-weight);letter-spacing:-0.2px}
.w-acctpop-x{flex:0 0 auto;width:22px;height:22px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink2);display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.w-acctpop-x:hover{background:var(--hover);color:var(--ink)}
.w-acctpop-body{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.w-acctpop-acc{display:flex;align-items:center;gap:12px}
.w-acctpop-who{min-width:0}
.w-acctpop-who .n{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:var(--h-weight);letter-spacing:-0.2px}
.w-acctpop-who .u{margin-top:3px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-acctrows{display:flex;flex-direction:column;gap:10px;margin:0}
.w-acctrows dt{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-bottom:3px}
.w-acctrows dd{font-size:12.5px;line-height:1.7;color:var(--ink)}
.w-avatar{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.w-accterr{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;line-height:1.65;color:var(--error)}
.w-statchip{flex:0 0 auto;font-family:var(--mono);font-size:10px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink2)}
.w-statchip.ok{color:var(--green);border-color:rgba(7,181,111,.35)}
.w-statchip.bad{color:var(--error);border-color:var(--error-line)}
.w-statchip.busy{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
/* 重新获取账号：整行宽、居中的主色 CTA，一眼能看出这是主要动作 */
.w-relink{width:100%;justify-content:center;display:inline-flex;align-items:center;gap:6px;border:none;background:var(--accent);color:#fff;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;transition:filter .15s}
.w-relink:hover{filter:brightness(1.06)}
/* 账号 → 频道：凭据卡里的频道列表（小宇宙节目 / 喜马拉雅专辑 / 荔枝播单） */
.w-chlist{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.w-chhead{display:flex;align-items:center;justify-content:space-between}
.w-chhead>span{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.w-chsync{border:1px solid var(--line);background:var(--card);border-radius:999px;font-size:11px;color:var(--ink2);padding:3px 10px;cursor:pointer;transition:border-color .15s,color .15s}
.w-chsync:hover{border-color:var(--accent);color:var(--accent)}
.w-chrow{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.w-chdot{flex:0 0 8px;width:8px;height:8px;border-radius:3px}
.w-chname{font-size:12.5px;font-weight:600;letter-spacing:-0.1px}
.w-chmeta{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink2)}
/* 发布弹层：多频道平台的频道选择行 */
.m-chrows{display:flex;flex-direction:column;gap:0;padding:4px 6px 0}
.m-chrow{display:flex;align-items:center;gap:12px;padding:12px 4px 2px;margin-top:8px;border-top:1px dashed var(--line)}
.m-chsq{flex:0 0 26px;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.m-chlabel{font-size:13px;color:var(--ink2)}
.m-chrow .w-selwrap{margin-left:auto}

/* ===== 专注模式：侧栏宽度只由全局开关控制 =====
   侧栏折叠只收起导航层；TitleBar 和 toggle 永远保留。
   不再有 fixed 悬浮按钮，也不允许页面头部与拖拽热区重叠。 */
.w-rail{transition:flex-basis .22s ease,opacity .16s ease}
.w-rail{overflow:hidden}
.w-rail.fr-collapsed{flex-basis:0;opacity:0;pointer-events:none;border-right-color:transparent}
.w-rail.fr-collapsed .w-railclip{min-width:208px} /* 收起过程中内容不回绕，靠 aside 裁切 */
.fr-hint{position:fixed;right:18px;bottom:18px;z-index:55;font-family:var(--mono);font-size:10.5px;color:var(--ink3);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;pointer-events:none;opacity:0;transition:opacity .2s}
.fr-hint.on{opacity:1}

</style>
