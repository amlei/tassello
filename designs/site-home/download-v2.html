<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>下载页 V2 · 九漾 Onda</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #FFFFFF; --card: #FFFFFF; --rail: #FBFBFA; --line: #EDECE9; --hover: #F4F3F1;
      --ink: #37352F; --ink2: #787672; --ink3: #ABA9A4; --accent: #2383E2; --accent-tint: #E9F3FB;
      --shadow-card: 0 1px 2px rgba(15,15,15,.04); --shadow-panel: 0 24px 70px rgba(15,15,15,.1);
      --font: -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --paper: #191919; --card: #252525; --rail: #202020; --line: #2F2F2F; --hover: #2A2A2A;
      --ink: #E6E5E3; --ink2: #9B9A97; --ink3: #6F6E69; --accent: #4A9EE8; --accent-tint: #20304A;
      --shadow-card: 0 1px 2px rgba(0,0,0,.3); --shadow-panel: 0 24px 80px rgba(0,0,0,.48);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; cursor: pointer; }
    img { display: block; max-width: 100%; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
    .shell { width: min(1180px, calc(100% - 48px)); margin: auto; }

    .header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); }
    .header-shell { display: flex; align-items: center; justify-content: space-between; min-height: 68px; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 770; letter-spacing: -.04em; }
    .brand-logo { width: 30px; height: 30px; object-fit: contain; }
    .brand small { display: block; color: var(--ink3); font-family: var(--mono); font-size: 9px; letter-spacing: .12em; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .header-link { padding: 9px 12px; border-radius: 999px; color: var(--ink2); font-size: 14px; }
    .header-link:hover { color: var(--ink); background: var(--hover); }
    .cta { display: inline-flex; align-items: center; min-height: 40px; padding: 0 18px; border-radius: 11px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 730; box-shadow: var(--shadow-card); }
    .theme-toggle { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink2); }
    .theme-toggle:hover { color: var(--ink); background: var(--hover); }

    main { padding: 58px 0 74px; }
    .hero { display: grid; grid-template-columns: minmax(0, .88fr) minmax(0, 1fr); gap: 54px; align-items: center; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--rail); color: var(--ink2); font-size: 12.5px; }
    .eyebrow:before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    h1 { margin: 18px 0 16px; font-size: clamp(40px, 5.2vw, 68px); line-height: 1.04; letter-spacing: -.055em; font-weight: 790; }
    h1 em { font-style: normal; color: var(--accent); }
    .subtitle { max-width: 530px; margin: 0 0 28px; color: var(--ink2); font-size: 17px; line-height: 1.68; }
    .primary-download {
      display: inline-flex; align-items: center; gap: 15px; min-height: 68px; padding: 9px 26px 9px 10px;
      border: 0; border-radius: 999px; background: #191919; color: #fff; font-size: 18px; font-weight: 770; letter-spacing: -.02em;
      box-shadow: 0 20px 50px -24px rgba(15,15,15,.72); transition: transform .2s ease, filter .2s ease;
    }
    .primary-download:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .primary-icon { flex: 0 0 auto; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: #fff; }
    .primary-label small { display: block; margin-top: 3px; color: rgba(255,255,255,.64); font-size: 12px; font-weight: 550; }
    [data-theme="dark"] .primary-download { background: #F5F5F3; color: #151515; }
    [data-theme="dark"] .primary-label small { color: rgba(21,21,21,.62); }
    .meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 22px; color: var(--ink2); font-size: 13.5px; }
    .meta-row a { border-bottom: 1px solid color-mix(in srgb, var(--accent) 38%, transparent); padding-bottom: 2px; }
    .meta-row a:hover { color: var(--ink); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #FD8D11; box-shadow: 0 0 0 4px color-mix(in srgb, #FD8D11 14%, transparent); }

    .visual { position: relative; }
    .visual:before { content: ""; position: absolute; inset: -8% -6% auto; height: 76%; background: radial-gradient(circle, var(--accent-tint), transparent 64%); filter: blur(20px); z-index: -1; }
    .visual-frame { border-radius: 26px; overflow: hidden; box-shadow: var(--shadow-panel); background: var(--rail); }
    .visual-frame img { width: 100%; height: auto; }

    .picker { margin-top: 70px; }
    .picker-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    h2 { margin: 0; font-size: clamp(25px, 2.6vw, 34px); letter-spacing: -.045em; }
    .picker-copy { max-width: 540px; margin: 10px 0 0; color: var(--ink2); font-size: 15px; line-height: 1.65; }
    .detected { color: var(--ink3); font-size: 13px; white-space: nowrap; }

    .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .card {
      position: relative; display: flex; flex-direction: column; min-height: 235px; padding: 21px 19px 17px; text-align: left;
      background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow-card);
      transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 18px 42px -30px rgba(15,15,15,.5); }
    .card.selected { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink), var(--shadow-card); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .os-icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: var(--rail); color: var(--ink); }
    .badge { padding: 5px 9px; border-radius: 999px; background: #191919; color: #fff; font-size: 11px; font-weight: 750; }
    .card.selected .badge { background: var(--accent); }
    .card h3 { margin: 22px 0 5px; font-size: 21px; letter-spacing: -.035em; }
    .arch { color: var(--ink2); font-size: 13.5px; }
    .card-divider { height: 1px; margin: 17px 0 13px; background: var(--line); }
    .download-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink); font-size: 14px; font-weight: 720; }
    .download-line span { color: var(--ink3); font-size: 12px; font-weight: 520; }
    .format { color: var(--ink); font-weight: 740; }
    .availability { margin-top: 8px; color: var(--ink3); font-size: 12px; }
    .card.selected .availability { color: var(--accent); }
    .github-row {
      display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 14px; padding: 17px 19px;
      border: 1px dashed var(--line); border-radius: 18px; color: var(--ink2); background: color-mix(in srgb, var(--rail) 68%, transparent); font-size: 14px;
    }
    .github-row a { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 730; }
    .github-row a:hover { color: var(--accent); }
    .feedback { min-height: 42px; display: flex; align-items: center; margin-top: 16px; padding: 10px 14px; border-radius: 12px; background: var(--rail); color: var(--ink2); font-size: 13px; line-height: 1.5; }
    .feedback strong { color: var(--ink); }

    footer { padding: 32px 0 42px; border-top: 1px solid var(--line); color: var(--ink2); font-size: 13px; }
    .footer-shell { display: flex; justify-content: space-between; gap: 20px; }
    .footer a:hover { color: var(--ink); }

    @media (max-width: 1020px) {
      .hero { grid-template-columns: 1fr; gap: 36px; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .picker-head { display: block; }
      .detected { margin-top: 12px; white-space: normal; }
      .visual { order: -1; }
    }
    @media (max-width: 620px) {
      .shell { width: calc(100% - 36px); }
      .header-link { display: none; }
      .cards { grid-template-columns: 1fr; }
      .primary-download { width: 100%; justify-content: flex-start; }
      .footer-shell { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="shell header-shell">
      <a class="brand" href="/" aria-label="九漾 Onda 首页">
        <img class="brand-logo" src="../../apps/web/public/logo.svg" alt="">
        <span>九漾 Onda<small>TASSELLO</small></span>
      </a>
      <div class="header-actions">
        <a class="header-link" href="/changelog">更新日志</a>
        <a class="cta" href="https://github.com/amlei/tassello" target="_blank" rel="noopener">GitHub</a>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换到深色主题">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" aria-hidden="true"><path d="M20.5 14.2A8.7 8.7 0 0 1 9.8 3.5A8.75 8.75 0 1 0 20.5 14.2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="shell hero" aria-labelledby="download-title">
      <div>
        <p class="eyebrow">桌面工作台 · v0.1.0</p>
        <h1 id="download-title">下载 <em>Onda</em>，<br>让发布更有序。</h1>
        <p class="subtitle">把文章、贴图、视频和音频放进同一个内容库，完成多平台适配，并在关键发布节点保留人工确认。</p>
        <button class="primary-download" id="primaryDownload" type="button">
          <span class="primary-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none"><path d="M12 4v11m0 0 4.2-4.2M12 15l-4.2-4.2M5 19h14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="primary-label">
            免费下载 <span id="primaryPlatform">macOS（Apple Silicon）</span>
            <small id="primaryFormat">DMG 安装包 · 正在整理</small>
          </span>
        </button>
        <div class="meta-row">
          <span class="status-dot" aria-hidden="true"></span>
          <span>安装包链接占位中</span>
          <a href="/changelog">更新日志</a>
          <a href="https://github.com/amlei/tassello/releases" target="_blank" rel="noopener">GitHub Releases</a>
        </div>
      </div>
      <div class="visual" aria-hidden="true">
        <div class="visual-frame">
          <img src="assets/screenshots/01-editor-preview.png" alt="">
        </div>
      </div>
    </section>

    <section class="shell picker" aria-labelledby="picker-title">
      <div class="picker-head">
        <div>
          <h2 id="picker-title">选择你的平台</h2>
          <p class="picker-copy">安装包会根据系统架构区分。选择后，上方按钮会同步为对应的下载目标。</p>
        </div>
      </div>

      <div class="cards" id="downloadCards" role="group" aria-label="下载平台选择">
        <button class="card" type="button" data-key="macos-arm" aria-pressed="false">
          <span class="card-top">
            <span class="os-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="23" height="23" fill="currentColor"><path d="M16.7 12.9c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.1-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.3 1.2 9.7.8 1.2 1.8 2.5 3.1 2.4 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.6-1-2.7-3.8zM14.4 5.3c.7-.8 1.1-1.9 1-3-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.5z"/></svg>
            </span>
            <span class="badge" data-badge hidden>推荐</span>
          </span>
          <h3>macOS</h3>
          <p class="arch">Apple Silicon · DMG</p>
          <span class="card-divider" aria-hidden="true"></span>
          <span class="download-line">下载安装包 <span class="format">DMG</span></span>
          <span class="availability">安装包整理中</span>
        </button>

        <button class="card" type="button" data-key="windows-x64" aria-pressed="false">
          <span class="card-top">
            <span class="os-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor"><path d="M3 5.5l7.6-1v7.1H3V5.5zm0 13l7.6 1v-7H3v6zm8.9 1.1L21 21v-8.4h-9.1v7zm0-15.2v7.1H21V3l-9.1 1.4z"/></svg>
            </span>
            <span class="badge" data-badge hidden>推荐</span>
          </span>
          <h3>Windows</h3>
          <p class="arch">x64 · 安装包</p>
          <span class="card-divider" aria-hidden="true"></span>
          <span class="download-line">下载安装包 <span class="format">EXE</span></span>
          <span class="availability">安装包整理中</span>
        </button>

     </div>

      <div class="github-row">
        <span>需要历史版本、校验信息或源码包？</span>
        <a href="https://github.com/amlei/tassello/releases" target="_blank" rel="noopener">
          前往 GitHub Releases
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true"><path d="M7 17 17 7m0 0H9m8 0v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>

    </section>
  </main>

  <footer class="footer">
    <div class="shell footer-shell">
      <span>© 九漾 Onda</span>
      <span><a href="/changelog">更新日志</a> · <a href="https://github.com/amlei/tassello" target="_blank" rel="noopener">GitHub</a></span>
    </div>
  </footer>

  <script>
    (() => {
      const root = document.documentElement;
      const toggle = document.getElementById("themeToggle");
      const moon = '<path d="M20.5 14.2A8.7 8.7 0 0 1 9.8 3.5A8.75 8.75 0 1 0 20.5 14.2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>';
      const sun = '<circle cx="12" cy="12" r="4.25" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.75v2.5M12 18.75v2.5M2.75 12h2.5M18.75 12h2.5M5.35 5.35l1.75 1.75M16.9 16.9l1.75 1.75M18.65 5.35 16.9 7.1M7.1 16.9l-1.75 1.75" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>';
      let theme = "light";
      const renderTheme = () => {
        root.dataset.theme = theme;
        const next = theme === "light" ? "dark" : "light";
        toggle.setAttribute("aria-label", `切换到${next === "light" ? "浅色" : "深色"}主题`);
        toggle.firstElementChild.innerHTML = theme === "light" ? moon : sun;
      };
      toggle.addEventListener("click", () => { theme = theme === "light" ? "dark" : "light"; renderTheme(); });
      renderTheme();

      const targets = {
        "macos-arm": { platform: "macOS（Apple Silicon）", format: "DMG 安装包", href: null },
        "macos-intel": { platform: "macOS（Intel）", format: "DMG 安装包", href: null },
        "windows-x64": { platform: "Windows x64", format: "EXE 安装包", href: null },
        "linux-x64": { platform: "Linux x64", format: "AppImage", href: null },
        github: { platform: "GitHub Releases", format: "历史版本", href: "https://github.com/amlei/tassello/releases" }
      };
      const getWebGLRenderer = () => {
        try {
          const canvas = document.createElement("canvas");
          const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
          if (!gl) return "";
          const info = gl.getExtension("WEBGL_debug_renderer_info");
          return info ? String(gl.getParameter(info.UNMASKED_RENDERER_WEBGL)) : String(gl.getParameter(gl.RENDERER));
        } catch { return ""; }
      };
      const detectKey = async () => {
        const ua = navigator.userAgent || "";
        const uaData = navigator.userAgentData;
        let platform = uaData?.platform || navigator.platform || "";
        let architecture = "";
        if (uaData?.getHighEntropyValues) {
          try {
            const hints = await uaData.getHighEntropyValues(["architecture", "platform"]);
            platform = hints.platform || platform;
            architecture = hints.architecture || "";
          } catch { /* 探测失败时回退到 UA / GPU。 */ }
        }
        if (platform === "Windows" || /Win/i.test(ua)) return "windows-x64";
        if (platform === "macOS" || /Mac|iPhone|iPad|iPod/i.test(ua)) {
          const renderer = getWebGLRenderer().toLowerCase();
          const evidence = [architecture, platform, navigator.platform || "", renderer].join(" ").toLowerCase();
          if (/\b(arm|aarch64)\b/.test(evidence) || renderer.includes("apple")) return "macos-arm";
          if (/\b(x86|x86-64|x64|intel)\b/.test(evidence)) return "macos-intel";
          return "macos-arm";
        }
        if (/Linux|X11/i.test(ua) && !/Android/i.test(ua)) return "linux-x64";
        return "github";
      };
      let initialKey = "macos-arm";
      let selectedKey = initialKey;
      const cards = [...document.querySelectorAll(".card")];
      const primary = document.getElementById("primaryDownload");
      const primaryPlatform = document.getElementById("primaryPlatform");
      const primaryFormat = document.getElementById("primaryFormat");
      const applyDetection = async () => {
        initialKey = await detectKey();
        if (!cards.some((card) => card.classList.contains("selected"))) selectedKey = initialKey;
        sync();
      };
      const sync = () => {
        const target = targets[selectedKey];
        cards.forEach((card) => {
          const selected = card.dataset.key === selectedKey;
          card.classList.toggle("selected", selected);
          card.setAttribute("aria-pressed", String(selected));
          const badge = card.querySelector("[data-badge]");
          badge.hidden = card.dataset.key !== initialKey;
        });
        primaryPlatform.textContent = target.platform;
        primaryFormat.textContent = target.href ? `${target.format} · 可直接下载` : `${target.format} · 正在整理`;
      };
      const startDownload = () => {
        const target = targets[selectedKey];
        if (target.href) location.href = target.href;
      };
      cards.forEach((card) => card.addEventListener("click", () => { selectedKey = card.dataset.key; sync(); }));
      primary.addEventListener("click", startDownload);
      sync();
      applyDetection();
    })();
  </script>
</body>
</html>
