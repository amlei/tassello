# 桌面安装包构建：Windows 包必须在 windows runner 上出（libsql/sharp 等
# 原生绑定无法从 macOS 交叉 trace），macOS 同理。产物构建后自动跑运行时自检。
name: build-desktop

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: main
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: release/*.exe
            name: windows-x64
          - os: macos-latest
            script: dist:mac
            artifact: release/*.dmg
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: 安装依赖
        run: bun install

      - name: 生成 Prisma client
        run: bun run db:generate

      - name: 构建 + 打包 + 自检
        working-directory: apps/desktop
        run: bun run ${{ matrix.script }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: tassello-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: 安装依赖
        run: bun install

      - name: 构建并打包浏览器扩展
        run: bun run package:extension

      - name: 上传扩展产物
        uses: actions/upload-artifact@v4
        with:
          name: tassello-extension
          path: release/*.zip
          if-no-files-found: error

  obsidian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: 安装依赖
        run: bun install

      - name: 构建并打包 Obsidian 插件
        run: bun run package:obsidian

      - name: 压缩 Obsidian 插件
        run: |
          version="$(node -p "require('./apps/obsidian/manifest.json').version")"
          mkdir -p release
          cd apps/obsidian/release
          zip -qr "../../../release/onda-obsidian-v${version}.zip" tassello-publisher

      - name: 上传 Obsidian 产物
        uses: actions/upload-artifact@v4
        with:
          name: tassello-obsidian
          path: release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, extension, obsidian]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: 发布下载产物
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          generate_release_notes: true
